# Phase 0.3 of docs/TESTING_STRATEGY_PLANNING.md, closing half of blindspot B10:
# the JS dependency surface had no automated update or vulnerability tracking at
# all, and `bootstrap` sits pinned at 5.1.3 (2021) feeding the SCSS build.
#
# Grouping policy: batch only what MUST move together, and keep everything whose
# failure mode is worth attributing on its own pull request.
#
# Three sessions work this repository concurrently and every PR runs a ~15-job
# pipeline, so batching is genuinely valuable -- but only where a grouped red
# build still tells you which package caused it. The npm block below explains
# where that line fell in practice.
#
#   npm             -> grouped ONLY by compatibility (peer-pinned packages).
#   github-actions  -> grouped by minor/patch; actions are mutually independent.
#   pip             -> ungrouped. Flask, Werkzeug and Jinja2 are runtime
#                      dependencies of a local-first app where a bad bump is a
#                      user-visible break; they deserve one PR each.
#
# Majors are isolated everywhere except inside a peer-pinned family, where
# splitting them would produce an unresolvable lockfile.
version: 2

updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # `playwright` is one half of a cross-ecosystem lockstep; the npm block below
    # carries the full reasoning and the unblock condition. Dependabot cannot
    # group pip and npm together, so leaving this side unignored just produces
    # the same one-sided red from the other direction.
    ignore:
      - dependency-name: "playwright"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    # Pins that are contracts, not preferences. Every entry below reds a required
    # test the moment Dependabot moves it alone, so the rule exists to stop a
    # weekly pull request that could only ever be closed.
    #
    # Only `version-update:` types are listed, deliberately. A security advisory
    # against any of these still reaches us as a security update; what is
    # suppressed is the routine version bump.
    #
    # NOT ignored, and deliberately so: `bootstrap` and `sass`. Bootstrap has a
    # version contract too (tests/test_bootstrap_version_contract.py), but it is
    # a *relative* one -- it reads whatever package.json declares and asserts
    # base.html's two CDN URLs match. A bump reds it, and the fix is a two-line
    # template edit, not a re-baselining packet. That is an upgrade worth seeing.
    ignore:
      # Stylelint and its SCSS parser are the CSS measurement instrument, not
      # ordinary tooling. tests/test_css_cascade_contracts.py pins both exactly
      # and asserts the counters in docs/CSS_PHASE4_WP4_1_STYLELINT_BASELINE.json
      # (warningCount 7202 at sourceCommit 9ee7638). A changed rule or parser
      # implementation moves that count on byte-identical CSS -- at which point
      # the number stops measuring CSS debt and starts measuring tool churn.
      #
      # This rule covered majors only, the #268/#252 precedent written for
      # stylelint 16 -> 17. But the contract asserts a *literal* version, so #287
      # (16.11.0 -> 16.26.1, a minor) red it just as hard, and a patch would too.
      # Widened to every version-update type on 2026-08-03. Moving either pin is
      # a deliberate re-baselining packet that rewrites the committed JSON.
      - dependency-name: "stylelint"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
      - dependency-name: "postcss-scss"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"

      # Playwright ships one browser build per release, and
      # tests/test_playwright_version_contract.py (blindspot B9) requires
      # package.json and requirements.txt to pin the identical literal version.
      # Dependabot raises the two ecosystems as separate pull requests and cannot
      # group across them, so every Playwright bump arrives one-sided and red --
      # #288 (1.61.0 -> 1.62.1) was the first to prove it.
      #
      # The upgrade is not merely blocked on paperwork. 1.61.0 -> 1.62.1 moves
      # Chromium 148.0.7778.96 -> 151.0.7922.34, and every committed visual
      # baseline was rendered by 148. The visual specs run only in deep-gate.yml's
      # manual, opt-in `visual-linux` job and are excluded from ci.yml, so the
      # bump would invalidate all of them with nothing going red on the pull
      # request -- the next deep-gate run inherits the wall of failures instead.
      #
      # UNBLOCK CONDITION: remove this entry and its pip twin once the
      # visual-baseline arc has settled -- #281's Linux regeneration merged and
      # #286's determinism work resolved -- then bump both ecosystems in a single
      # branch and regenerate both platforms' baselines in the same arc.
      # Rationale and evidence: docs/P1_6_DEPENDENCY_QUEUE_CLOSEOUT.md.
      - dependency-name: "@playwright/test"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
          - "version-update:semver-patch"
    # Grouping is by COMPATIBILITY, not by semver category.
    #
    # The first attempt grouped every npm package whose bump happened to be
    # minor-or-patch. That put `bootstrap` 5.1.3 -> 5.3.8 (a 2021->2025 jump that
    # is only technically minor) in the same pull request as `sass`
    # 1.94 -> 1.102, and the pair broke the SCSS build:
    #
    #   node_modules/bootstrap/scss/_functions.scss 37:24
    #   @return red($value), green($value), blue($value);
    #                        ^^^^^^^^^^^^^  Undefined variable
    #
    # Because both moved together, the log could not say which one was at fault.
    # Sharing a semver category is not evidence that two packages are safe to
    # review as one change; it is only evidence that their version numbers moved
    # by a similar amount.
    #
    # So only packages that MUST move together are grouped. Everything else --
    # bootstrap, sass, stylelint, postcss-scss, @playwright/test -- is
    # deliberately ungrouped and arrives one package per pull request, which is
    # what makes a red build attributable.
    groups:
      # A genuine compatibility constraint, not tidiness. @vitest/coverage-v8
      # declares an EXACT peer on vitest ("vitest": "4.1.10"), so bumping either
      # alone leaves the lockfile unresolvable and `npm ci` fails. Deliberately
      # NOT restricted to minor/patch: a vitest major must carry its coverage
      # provider with it for exactly the same reason.
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"

      # The compiler and the type definitions it consumes. Restricted to
      # minor/patch so a TypeScript major arrives on its own and gets read.
      typescript:
        patterns:
          - "typescript"
          - "@types/*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(actions)"
    # Left grouped by semver category on purpose. Actions are independent of one
    # another -- there is no shared build artefact for a bad pair to corrupt --
    # and a patch bump across four actions is pure noise. Majors already arrive
    # separately under this rule, which is how the v7 bumps showed up as four
    # reviewable pull requests rather than one.
    groups:
      actions-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
