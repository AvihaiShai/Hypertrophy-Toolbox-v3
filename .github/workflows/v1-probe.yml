name: V1 Probe (THROWAWAY - dropCompositingHints stability)

# ============================================================================
# DISPOSABLE INVESTIGATION INSTRUMENTATION. DELETE WITH probe/v1-drop-compositing-hints.
#
# Answers exactly one question from the V1 owner ruling (2026-08-29): does
# dropCompositingHints() at capture time produce byte-identical rasters across
# three fresh generations on ubuntu-24.04 and three on windows-2022?
#
# It compares generated rasters ONLY with other rasters from the same platform,
# the same arm and the same job. It NEVER compares against a committed baseline
# -- a compare against baselines generated WITH the promotion cannot distinguish
# "nondeterministic" from "legitimately different", which is exactly the category
# error that discarded this control in visual_determinism/PLANNING.md 8.5.
#
# WHY `push:` AND NOT `workflow_dispatch:` ALONE. GitHub resolves a
# workflow_dispatch workflow from the DEFAULT branch, so dispatching a file that
# exists only here returns:
#   HTTP 404: workflow v1-probe.yml not found on the default branch
# The owner ruled the probe branch must not merge, so a branch-scoped push
# trigger is the only path that reaches these runner images without putting this
# file on main. The branch filter is a single literal: this workflow CANNOT fire
# on main, on develop, on a pull request, or on a schedule.
#
# NOTHING IS COMMITTED OR PUSHED. --update-snapshots writes into the runner
# workspace only; the PNGs leave as an artifact for offline hashing. There is no
# commit, push, or baseline-acceptance step anywhere in this file.
# ============================================================================

on:
  push:
    branches: ['probe/v1-drop-compositing-hints']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-probe-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  probe:
    name: V1 probe ${{ matrix.platform }} / ${{ matrix.arm }}
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-24.04, windows-2022]
        arm: [control, treatment]

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install npm dependencies
      run: npm ci

    - name: Build Bootstrap-customized CSS
      run: npm run build:css

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    # Without the committed fixture, prepare_visual_db.py falls back to
    # data/database.db and could render real data into the measurement.
    - name: Assert committed visual seed present
      shell: bash
      run: test -f e2e/fixtures/database.visual.seed.db

    # Record what the run actually is, so an artifact can never be misattributed
    # to the wrong platform, arm or toolchain after the fact.
    - name: Record run provenance
      shell: bash
      run: |
        mkdir -p artifacts/probe
        {
          echo "sha=$(git rev-parse HEAD)"
          echo "platform=${{ matrix.platform }}"
          echo "runner_os=$RUNNER_OS"
          echo "arm=${{ matrix.arm }}"
          echo "run_id=${{ github.run_id }}"
          echo "image=${ImageOS:-unknown}/${ImageVersion:-unknown}"
          echo "node=$(node --version)"
          echo "python=$(python --version 2>&1)"
          echo "playwright=$(npx playwright --version)"
        } | tee artifacts/probe/provenance.txt

    # Three fresh generations, sequentially, each with its own prepared database,
    # Flask process and Chromium process -- the same shape as PLANNING.md 3.4's
    # "three isolated DB, server and browser generations".
    #
    # Both snapshot specs. The thumbnails spec carries plan-desktop-light-simple,
    # the capture #322 proved races on windows-2022 and which ci.yml's
    # visual-windows job does not run.
    #
    # PW_MEASURE_EXEMPT=1 makes the five BYTE_GATE_EXEMPT captures produce pixels;
    # without it they return before toHaveScreenshot and the probe would measure
    # only the 81 that already work. BYTE_GATE_EXEMPT itself is unmodified.
    #
    # The playwright exit code is recorded, not enforced: the datum is the raster
    # bytes, and a first-time snapshot write can report non-zero while producing
    # exactly the pixels being measured.
    - name: Generate rasters (3 fresh generations)
      env:
        PW_VISUAL_SEED: '1'
        PW_PORT: '5058'
        PW_DB_PATH: 'artifacts/e2e/database.v1probe.db'
        PW_MEASURE_EXEMPT: '1'
        PW_DROP_HINTS: ${{ matrix.arm == 'treatment' && '1' || '' }}
      shell: bash
      run: |
        echo "arm=${{ matrix.arm }}  PW_DROP_HINTS=[${PW_DROP_HINTS}]  (empty = control)"
        for n in 1 2 3; do
          echo "::group::generation $n"
          # Identical starting conditions for every generation: committed
          # baselines restored, and anything the previous generation created
          # (the five exempt captures have no committed PNG) removed.
          git checkout -- e2e/__screenshots__
          git clean -fdq e2e/__screenshots__
          set +e
          npx playwright test --project=chromium \
            e2e/visual.spec.ts e2e/visual-baseline-thumbnails.spec.ts \
            --update-snapshots
          code=$?
          set -e
          echo "generation $n playwright exit=$code" >> artifacts/probe/provenance.txt
          mkdir -p "artifacts/probe/gen-$n"
          cp -r e2e/__screenshots__/. "artifacts/probe/gen-$n/"
          echo "::endgroup::"
        done
        git checkout -- e2e/__screenshots__
        git clean -fdq e2e/__screenshots__

    # sha256 every produced PNG, per generation. Written as a runner-side temp
    # script so the repository gains no file, and in node so one implementation
    # covers both runner images.
    - name: Hash and compare the three generations
      if: always()
      shell: bash
      run: |
        cat > "$RUNNER_TEMP/manifest.mjs" <<'MJS'
        import { createHash } from 'node:crypto';
        import { existsSync, readFileSync, readdirSync, statSync, writeFileSync } from 'node:fs';
        import { join, relative } from 'node:path';

        const walk = (dir) => readdirSync(dir).flatMap((e) => {
          const full = join(dir, e);
          return statSync(full).isDirectory() ? walk(full) : [full];
        });
        const hashes = (root) => Object.fromEntries(
          walk(root).filter((f) => f.endsWith('.png')).map((f) => [
            relative(root, f).split('\\').join('/'),
            createHash('sha256').update(readFileSync(f)).digest('hex'),
          ]),
        );

        const gens = [1, 2, 3].map((n) => `artifacts/probe/gen-${n}`);
        for (const g of gens) if (!existsSync(g)) { console.error(`MISSING ${g}`); process.exit(1); }
        const [a, b, c] = gens.map(hashes);

        const names = [...new Set([...Object.keys(a), ...Object.keys(b), ...Object.keys(c)])].sort();
        const rows = names.map((file) => {
          const h = [a[file], b[file], c[file]];
          const present = h.filter(Boolean).length;
          const stable = present === 3 && h[0] === h[1] && h[1] === h[2];
          return { file, present, stable, sha256: h };
        });

        const unstable = rows.filter((r) => !r.stable);
        writeFileSync('artifacts/probe/stability.json', JSON.stringify(
          { total: rows.length, stable: rows.length - unstable.length, unstable: unstable.length, rows },
          null, 1,
        ));

        console.log(`captures: ${rows.length}   stable: ${rows.length - unstable.length}   UNSTABLE: ${unstable.length}`);
        console.log('');
        for (const r of rows) {
          const mark = r.stable ? 'stable  ' : 'UNSTABLE';
          console.log(`${mark} ${r.file}`);
          if (!r.stable) r.sha256.forEach((s, i) => console.log(`           gen${i + 1} ${s ?? '(absent)'}`));
        }
        MJS
        node "$RUNNER_TEMP/manifest.mjs"

    - name: Upload rasters, hashes and provenance
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: v1-probe-${{ matrix.platform }}-${{ matrix.arm }}
        path: artifacts/probe/**
        retention-days: 7

    - name: Upload Playwright report on failure
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: v1-probe-report-${{ matrix.platform }}-${{ matrix.arm }}
        path: artifacts/playwright
        retention-days: 7
