name: Deep Gate Visual (Linux)

# The Linux half of visual regression (Phase 4.2), split out of deep-gate.yml by
# CI/CD expansion packet E1 (docs/ci_cd_expansion/PLANNING.md §4). It used to be
# the `visual-linux` job of the six-job Deep Gate, where one workflow conclusion
# covered both: a red visual job hid whether the other six were green, and a
# green six-job run could not say anything about the Linux comparison. As its own
# workflow it reports its own conclusion, and the D3 watchdog
# (deep-gate-watch.yml, scripts/deep_gate_watch.py) tracks each workflow's issue
# independently -- a green six-job Deep Gate never resolves a Linux visual issue.
#
# It runs on the weekly schedule in compare mode, or manually via
# workflow_dispatch (`gh workflow run deep-gate-visual.yml --ref <branch>`, add
# `-f visual_mode=generate` to render new baselines). It is NEVER a required PR
# check: there is deliberately no push or pull_request trigger.
#
# Deliberate interface delta from deep-gate.yml: the `run_visual` boolean input is
# gone. It only gated this job inside the mixed workflow; dispatching this
# workflow IS the opt-in now, so the job carries no job-level `if:` at all.
#
# The committed PNGs are split by platform (e2e/__screenshots__/{win32,linux}/);
# the Linux baselines are generated by this workflow's `generate` mode and
# committed by the owner after review (see docs/archive/ci_cd/phase4_2/PLANNING.md).
# Visual policy (ADR-011: byte-gated captures plus the semantic exemptions) is
# unchanged by the move.
#
# This workflow owns the LINUX half only. Since #322, ci.yml's `visual-windows`
# job byte-compares the win32 corpus on every PR and every push to main, so the
# weekly run does not need to and must not duplicate it here.
on:
  schedule:
    # Mondays at 03:17 UTC, the same slot as deep-gate.yml; a non-zero minute
    # avoids the top-of-hour queue spike. scripts/deep_gate_watch.py keys its
    # freshness check on this slot (SLOT_WEEKDAY / SLOT_TIME).
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      visual_mode:
        description: 'Visual mode: compare against committed Linux baselines, or generate new ones'
        type: choice
        options: [compare, generate]
        default: compare

# Checkout needs contents: read; all unspecified token scopes are disabled.
# Artifact/cache uploads use the runner runtime token, not actions: write.
permissions:
  contents: read

jobs:
  visual-linux:
    name: Visual regression (Linux baselines)
    # No job-level `if:`. A skipped job counts as success, and this is a
    # single-job workflow: a condition here could make the weekly run report green
    # without comparing anything. The schedule always runs; dispatch is the opt-in.
    #
    # PINNED to ubuntu-24.04 (NOT ubuntu-latest): the generate and compare runs
    # must share one runner image so the renderer (Chromium build + bundled fonts
    # + freetype) matches by construction. A GitHub image promotion must not
    # silently move fonts and red the gate. This MUST match the image used to
    # generate the committed e2e/__screenshots__/linux/ baselines.
    #
    # timeout-minutes is a HANG DETECTOR, not a budget: observed max 6.6 min over
    # the 20 most recent completed runs (2026-08-11, as deep-gate.yml's
    # visual-linux job), matching ci.yml's Visual Regression Windows bound.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install npm dependencies
      run: npm ci

    - name: Build Bootstrap-customized CSS
      run: npm run build:css

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    # Fail fast if the committed visual seed is missing — prepare_visual_db.py
    # would otherwise fall back to data/database.db (DEFAULT_SOURCE) and could
    # render real data into a baseline artifact.
    - name: Assert committed visual seed present
      run: test -f e2e/fixtures/database.visual.seed.db

    # A schedule event carries no `inputs` at all, so the fallback already
    # resolves to compare. Pin it again on the event name so the weekly run
    # stays compare-only even if the input default is ever changed, and
    # publish the resolved value — every later step reads it rather than
    # re-deriving "is this a generate run" from the raw input.
    #
    # E1 split the former single `Run visual specs` step into this resolver plus
    # one compare and one generate step, so which mode actually executed is
    # visible in the Actions API: D3 counts a visual recovery only when the
    # compare step itself ran and succeeded. The input and event name arrive
    # through env, never as `${{ }}` inside the script.
    - name: Resolve visual mode
      id: mode
      env:
        VISUAL_MODE: ${{ inputs.visual_mode || 'compare' }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        MODE="$VISUAL_MODE"
        if [ "$EVENT_NAME" = "schedule" ]; then
          MODE=compare
        fi
        case "$MODE" in
          compare|generate) ;;
          *) echo "unknown visual mode: $MODE" >&2; exit 1 ;;
        esac
        echo "mode=$MODE" >> "$GITHUB_OUTPUT"
        echo "Visual mode: $MODE"

    # Run ONLY the visual specs. PW_VISUAL_SEED=1 makes playwright.config.ts
    # seed the throwaway DB with the plan-bearing visual seed (prepare_visual_db.py)
    # in the webServer command before Flask opens it — no per-spec runtime DB
    # rewrite. compare diffs against the committed e2e/__screenshots__/linux/
    # baselines and can never update them; generate writes them (via the
    # {platform} snapshotPathTemplate). Both steps render the same spec list.
    - name: Run visual specs (compare)
      id: visual
      if: steps.mode.outputs.mode == 'compare'
      env:
        PW_VISUAL_SEED: '1'
      run: |
        npx playwright test --project=chromium \
          e2e/visual.spec.ts e2e/visual-baseline-thumbnails.spec.ts \
          e2e/workout-plan-desktop-contract.spec.ts

    - name: Run visual specs (generate)
      if: steps.mode.outputs.mode == 'generate'
      env:
        PW_VISUAL_SEED: '1'
      run: |
        npx playwright test --project=chromium \
          e2e/visual.spec.ts e2e/visual-baseline-thumbnails.spec.ts \
          e2e/workout-plan-desktop-contract.spec.ts --update-snapshots

    # #322 made "CI never writes baselines" mechanical for the Windows suite in
    # ci.yml; this job had only ever asserted it in prose, which was tenable
    # while every run was launched and watched by hand. A scheduled run is
    # unattended by definition, and Playwright CREATES a missing baseline
    # instead of failing — so a green compare is not by itself proof that
    # nothing was written. always() so a compare that fails AND writes still
    # reports the write.
    - name: Assert compare mode wrote no baseline
      if: ${{ always() && steps.mode.outputs.mode != 'generate' }}
      run: |
        CHANGED="$(git status --porcelain -- e2e/__screenshots__)"
        if [ -n "$CHANGED" ]; then
          echo "$CHANGED"
          echo "a compare run wrote to e2e/__screenshots__; baselines change only through a reviewed generate run"
          exit 1
        fi

    # generate → upload the freshly rendered Linux baselines for owner review+commit.
    # CI never pushes to main (branch-protected) — every pixel change is committed
    # by a human after downloading and inspecting this artifact.
    - name: Upload generated Linux baselines
      if: ${{ steps.mode.outputs.mode == 'generate' }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: visual-baselines-linux
        path: e2e/__screenshots__/linux/**
        retention-days: 14

    # compare (or generate) failure → upload report + actual/expected/diff PNGs.
    - name: Upload Playwright report + diffs
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: visual-linux-report
        path: artifacts/playwright
        retention-days: 7
