name: A3 functional rehearsal
on:
  push:
    branches: [rehearsal/a3-candidate-four-20261021]
permissions:
  contents: read
jobs:
  frontend-build:
    name: Frontend Build (npm ci + SCSS)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install npm dependencies
      run: npm ci

    # Deleting the tracked output first is what makes the gate below prove
    # PRODUCTION as well as equality. Building over the checked-out files can only
    # ever detect a *changed* artifact: if the compiler stopped emitting one --
    # `--no-source-map` added to the npm script is the realistic way -- the stale
    # committed copy would simply survive on disk and diff clean, and the gate
    # would report success over output nothing had regenerated. From an empty
    # start, a file the build fails to recreate is a deletion in the working
    # tree, and `git diff` reports deletions.
    - name: Remove the tracked CSS build output before rebuilding
      run: |
        rm -f \
          static/css/bootstrap.custom.min.css \
          static/css/bootstrap.custom.min.css.map

    - name: Build Bootstrap-customized CSS
      run: npm run build:css

    # BLOCKING. The step above rebuilt both artifacts from an empty start, so the
    # working tree now holds freshly compiled output and the index still holds
    # what the branch committed. A clean diff is the proof that the two agree.
    #
    # Both paths are named explicitly. The map is not decoration: it is the file
    # that records which SCSS sources and which line offsets produced the bundle,
    # so a source-only move (a rule relocated between partials, a renamed
    # partial) can leave the minified CSS byte-identical and change only the map.
    # Checking the bundle alone would call that "no drift".
    #
    # --stat, not a full diff: the bundle is one 127 KB line, and dumping it into
    # the log on failure buries the verdict it is supposed to deliver. The
    # exit code is the gate; --stat only decides what gets printed.
    #
    # The fix for a red here is never a workflow edit and never an edit to the
    # compiled files: run `npm run build:css` and commit both regenerated
    # artifacts in the PR that changed the SCSS.
    - name: Fail on compiled-CSS drift
      run: |
        set +e
        git diff --exit-code --stat -- \
          static/css/bootstrap.custom.min.css \
          static/css/bootstrap.custom.min.css.map
        STATUS=$?
        set -e
        if [ "$STATUS" -ne 0 ]; then
          echo "::error title=Compiled CSS drift::static/css/bootstrap.custom.min.css and/or its .map do not match a fresh 'npm run build:css'. Rebuild and commit both artifacts."
          {
            echo "### Compiled SCSS drift — blocking"
            echo
            # shellcheck disable=SC2016 # backticks are literal Markdown, not substitution
            echo 'The committed bundle does not match what `npm run build:css` produces from'
            # shellcheck disable=SC2016 # backticks are literal Markdown, not substitution
            echo '`scss/custom-bootstrap.scss`. Run the build and commit **both** regenerated'
            echo 'artifacts in the same PR that changed the SCSS:'
            echo
            echo '```'
            echo 'npm run build:css'
            echo 'git add static/css/bootstrap.custom.min.css static/css/bootstrap.custom.min.css.map'
            echo '```'
            echo
            echo 'Do not edit the compiled files by hand, and do not relax this gate.'
          } >> "$GITHUB_STEP_SUMMARY"
        else
          echo "::notice title=Compiled CSS::The committed bundle and map match a fresh 'npm run build:css'."
        fi
        exit $STATUS


  e2e-functional-shard:
    name: E2E Functional Shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: frontend-build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install npm dependencies
      run: npm ci

    - name: Build Bootstrap-customized CSS
      run: npm run build:css

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    # Deterministic functional/product specs only. Excluded by design (see
    # e2e/CLAUDE.md "CI inclusion contract"): visual + visual-baseline-thumbnails
    # (cross-OS rendering), and program-backup (runs isolated in e2e-backup).
    # visual-field-separator IS included despite the prefix: it reads composited
    # computed styles and asserts a numeric contrast ratio, so it has no pixel
    # baseline and no cross-OS rendering dependency.
    # accessibility + fatigue-stage4-smokes +
    # volume-progress were promoted here in A10 after a 5x-repeat ubuntu stability
    # probe (225/225 green, zero flakes). nav-dropdown was promoted after the
    # issue #8 1440px actionability fix; sharding remains `--shard=${{ matrix.shard }}/4`.
    # No --reporter flag: the CI-gated reporters in playwright.config.ts (list +
    # html + junit) must all emit so the artifact upload below has a report.
    - name: Run functional specs (shard ${{ matrix.shard }}/4)
      run: |
        npx playwright test --project=chromium --shard=${{ matrix.shard }}/4 \
          e2e/accessibility.spec.ts \
          e2e/api-integration.spec.ts \
          e2e/body-composition.spec.ts \
          e2e/browser-navigation-state.spec.ts \
          e2e/dark-mode.spec.ts \
          e2e/empty-states.spec.ts \
          e2e/error-handling.spec.ts \
          e2e/exercise-interactions.spec.ts \
          e2e/fatigue-stage4-smokes.spec.ts \
          e2e/fatigue.spec.ts \
          e2e/learned-calibration.spec.ts \
          e2e/nav-dropdown.spec.ts \
          e2e/progression.spec.ts \
          e2e/replace-exercise-errors.spec.ts \
          e2e/smoke-navigation.spec.ts \
          e2e/summary-pages.spec.ts \
          e2e/superset-edge-cases.spec.ts \
          e2e/ui-hardening.spec.ts \
          e2e/user-profile.spec.ts \
          e2e/validation-boundary.spec.ts \
          e2e/visual-field-separator.spec.ts \
          e2e/volume-progress.spec.ts \
          e2e/volume-splitter.spec.ts \
          e2e/workout-log.spec.ts \
          e2e/workout-plan.spec.ts

    # Timing visibility with no new status context and no rename. Reads the
    # junit.xml that playwright.config.ts already emits under CI and writes a
    # table to the job summary, so per-spec cost is visible on every run instead
    # of needing a local reproduction.
    #
    # `--shards 1` is deliberate. This step runs inside one matrix leg, so its
    # junit.xml holds that shard's quarter of the suite. Modelling a 4-way packing
    # of it would report a hypothetical re-split of an already-split quarter and
    # read as the global balance, which it is not. The real balance is the four
    # jobs' totals compared, and no single job can see all four.
    #
    # `always()` so a red shard still reports where its time went; `|| true` so
    # a summary problem can never turn a passing shard red.
    - name: Summarize shard timing
      if: always()
      run: |
        python scripts/playwright_timing_report.py \
          --junit artifacts/playwright/junit.xml \
          --shards 1 --top 12 --markdown \
          --label "shard ${{ matrix.shard }}/4 (required set)" >> "$GITHUB_STEP_SUMMARY" || true

    # Keep successful execution evidence without uploading the full HTML/trace
    # bundle on every green run. Report absence must fail this shard.
    - name: Upload functional JUnit
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-functional-report-shard-${{ matrix.shard }}-of-4
        path: artifacts/playwright/junit.xml
        if-no-files-found: error
        retention-days: 7

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: playwright-functional-shard-${{ matrix.shard }}-of-4
        path: artifacts/playwright
        retention-days: 7

  # Fan-in gate (leftovers A11). This job is the SINGLE branch-protection
  # required status check for functional E2E — its name "E2E Functional
  # (Chromium)" must stay byte-for-byte (renaming it orphans the required check
  # and blocks every PR; same rule as the typecheck job). It contains no test
  # logic: it just aggregates the matrix result. `needs.<matrix-job>.result` is
  # 'success' only when ALL shards succeeded, so this gate is green iff all four
  # shards passed. `if: always()` makes the gate run (and post its status) even
  # when a shard fails, so the required check turns red instead of staying
  # pending. Do NOT add the per-shard "E2E Functional Shard i/4" contexts to
  # branch protection — this gate is the contract.

  e2e-functional:
    name: E2E Functional (Chromium)
    # This fan-in reads only the needs context and never accesses the repository.
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: e2e-functional-shard
    if: always()

    steps:
    - name: Require all functional shards to pass
      run: |
        result="${{ needs.e2e-functional-shard.result }}"
        echo "e2e-functional-shard matrix aggregate result: $result"
        if [ "$result" != "success" ]; then
          echo "::error title=E2E Functional gate::One or more E2E Functional shards did not pass (result=$result)"
          exit 1
        fi
        echo "All E2E Functional shards passed."

