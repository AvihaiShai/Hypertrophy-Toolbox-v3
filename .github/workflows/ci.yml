  guard-hook-shard:
    name: Guard Hook Tests (Linux pwsh) shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
        - 3
        - 4
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version-file: .python-version
        cache: pip
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt

        '
    - name: Require PowerShell 7
      run: '# shellcheck disable=SC2016 # PowerShell, not bash, expands $PSVersionTable

        pwsh -NoProfile -NonInteractive -Command ''$PSVersionTable.PSVersion.ToString()''

        '
    - name: Collect and select this shard
      run: 'mkdir -p artifacts/guard

        python -m pytest --collect-only -q tests/test_guard_destructive_command.py > artifacts/guard/collected.txt

        python scripts/ci_executed_report.py shard artifacts/guard/collected.txt --index ${{ matrix.shard }} --total 4 > artifacts/guard/shard.txt

        '
    - name: Run guard-hook tests
      run: python -m pytest @artifacts/guard/shard.txt -v --tb=short --junitxml=artifacts/guard/junit.xml
    - name: Require executed shard identities without skips
      if: always()
      run: python scripts/ci_executed_report.py verify artifacts/guard/collected.txt artifacts/guard/junit.xml --index ${{
        matrix.shard }} --total 4
    - name: Upload guard-hook shard report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: guard-hook-junit-${{ matrix.shard }}
        path: 'artifacts/guard/collected.txt

          artifacts/guard/junit.xml

          '
        if-no-files-found: error
        retention-days: 7
