        \ step 5 names as core, corrected against the\n# tree: the plan says \"utils/double_progression*\", which does not\
        \ exist.\n# The double-progression logic lives in utils/progression_plan.py.\nCORE_PREFIXES = (\n    \"utils/effective_sets\"\
        ,\n    \"utils/progression_plan\",\n    \"utils/volume_\",\n    \"utils/program_backup\",\n)\n\ntry:\n    root = ET.parse(\"\
        artifacts/pytest/coverage.xml\").getroot()\nexcept Exception as exc:\n    print(\"### Coverage\\n\\nNo coverage report\
        \ was produced (%s).\" % exc)\n    raise SystemExit(0)\n\noverall = float(root.get(\"line-rate\", 0)) * 100\nclasses\
        \ = []\nfor cls in root.iter(\"class\"):\n    name = (cls.get(\"filename\") or \"\").replace(\"\\\\\", \"/\")\n  \
        \  classes.append((name, float(cls.get(\"line-rate\", 0)) * 100))\nclasses.sort()\n\nprint(\"### Python coverage (measure-only\
        \ \u2014 no threshold, D1)\")\nprint()\nprint(\"**Overall: %.1f%%** across %d measured files.\" % (overall, len(classes)))\n\
        print()\nprint(\"| Core module | Coverage |\")\nprint(\"|---|---:|\")\nfor name, rate in classes:\n    if name.startswith(CORE_PREFIXES):\n\
        \        print(\"| `%s` | %.0f%% |\" % (name, rate))\nprint()\nweakest = sorted(classes, key=lambda c: c[1])[:8]\n\
        print(\"<details><summary>Eight weakest modules</summary>\")\nprint()\nprint(\"| Module | Coverage |\")\nprint(\"\
        |---|---:|\")\nfor name, rate in weakest:\n    print(\"| `%s` | %.0f%% |\" % (name, rate))\nprint()\nprint(\"</details>\"\
        )\nprint()\nprint(\"No threshold is enforced. This number is the baseline for a future\")\nprint(\"baseline-diff ratchet;\
        \ see TESTING_STRATEGY_PLANNING.md section 8.6.\")\nPY\n"
    - name: Upload pytest JUnit XML
