name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

# CI hygiene (blindspot B9, Phase 0.2 of docs/TESTING_STRATEGY_PLANNING.md).
# Before this, rapid pushes to a pull request left every superseded run going,
# burning a full pipeline per push.
#
# The key is WORKFLOW-SCOPED on purpose (section 7.3 entry criterion 4): it
# begins with github.workflow, so "CI/CD Pipeline" runs share a group only with
# each other and can never contend with -- let alone cancel -- a
# "Deep Gate (manual)" run on the same ref.
#
# cancel-in-progress is restricted to pull_request events. A push to main or
# develop is never cancelled, so a merge always gets a complete pipeline even if
# another merge lands seconds later.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: '.python-version'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        # PYSEC-2026-3447 affects setuptools 79.0.1; upgrade to the fixed release.
        python -m pip install --upgrade "setuptools>=83.0.0"

    - name: Run pip-audit
      run: |
        # Pinned (B9): an unpinned runtime install left this REQUIRED gate's
        # behaviour depending on whatever pip-audit released that morning.
        pip install pip-audit==2.10.1
        # CVE-2026-3219 in pip itself has no Fix Version yet (upstream has
        # not released a patched pip). Remove --ignore-vuln once `pip`
        # publishes a fix.
        pip-audit --desc --ignore-vuln CVE-2026-3219
      continue-on-error: false

  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: '.python-version'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install flake8 pylint
        
    - name: Lint with flake8
      run: |
        # Stop the build if there are Python syntax errors or undefined names, plus
        # the flipped-to-blocking rules: F811 (redefinition), E711 (== None),
        # E712 (== True/False), F401 (unused import). F811/E711/E712 sat at ~0;
        # F401 was flipped after a guardrailed cleanup PR drove its 56 findings to
        # 0 (removed unused test/source imports + deleted the stray replace.py).
        flake8 . --count --select=E9,F63,F7,F82,F811,E711,E712,F401 --show-source --statistics --exclude=.venv,venv,env,.git,__pycache__,node_modules,artifacts,build,dist
        # Exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,venv,env,.git,__pycache__,node_modules,artifacts,build,dist

    # MEASURE-ONLY / NON-BLOCKING (Phase 3, docs/archive/ci_cd/phase3/PLANNING.md). Surfaces
    # the hardened-diagnostic backlog without failing the build. F811/E711/E712/F401
    # are now ALL BLOCKING in the "Lint with flake8" step above. The remaining
    # measured-only diagnostic is F841 — the expected `except ... as e` logging idiom
    # (logger.exception captures the active exception implicitly), NOT a flip candidate.
    - name: Flake8 diagnostics (non-blocking, measure-only)
      continue-on-error: true
      run: |
        EXCL=".venv,venv,env,.git,__pycache__,node_modules,artifacts,build,dist"
        flake8 . --select=F841 --count --statistics --exclude="$EXCL" > flake8_idiom.txt 2>&1 || true
        IDIOM=$(tail -1 flake8_idiom.txt | tr -d '[:space:]')
        echo "::notice title=flake8 diagnostics (non-blocking)::F841 idiom=$IDIOM"
        {
          echo "### flake8 diagnostics (non-blocking — measure-only)"
          echo "- **F841**: $IDIOM — expected \`except ... as e\` idiom, not a flip candidate"
        } >> "$GITHUB_STEP_SUMMARY"
        echo "===== F841 (idiom) ====="; cat flake8_idiom.txt

    - name: Upload flake8 diagnostics
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: static-analysis-flake8
        path: |
          flake8_idiom.txt
        retention-days: 14

  frontend-build:
    name: Frontend Build (npm ci + SCSS)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install npm dependencies
      run: npm ci

    - name: Build Bootstrap-customized CSS
      run: npm run build:css

  e2e-smoke:
    name: E2E Smoke (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: frontend-build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install npm dependencies
      run: npm ci

    - name: Build Bootstrap-customized CSS
      run: npm run build:css

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Run smoke spec
      run: npx playwright test e2e/smoke-navigation.spec.ts --project=chromium --reporter=line

  # Sharded functional E2E (leftovers A11). The deterministic functional set is
  # split across a 2-way matrix (`--shard=i/2`); each matrix leg is its own
  # runner with its own setup, server, and freshly-seeded throwaway DB (seeded by
  # playwright.config.ts's webServer command per server start), so cross-shard is
  # clean by construction and within-shard serial order-safety (fullyParallel:
  # false / workers:1) is unchanged. These per-shard contexts ("E2E Functional
  # Shard 1/2", "E2E Functional Shard 2/2") are NOT branch-protection required
  # checks — the single required context "E2E Functional (Chromium)" is preserved
  # by the e2e-functional fan-in gate below. fail-fast:false so a red in one shard
  # still lets the other finish (full failure picture + both artifacts).
  e2e-functional-shard:
    name: E2E Functional Shard ${{ matrix.shard }}/2
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: frontend-build
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install npm dependencies
      run: npm ci

    - name: Build Bootstrap-customized CSS
      run: npm run build:css

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    # Deterministic functional/product specs only. Excluded by design (see
    # e2e/CLAUDE.md "CI inclusion contract"): visual + visual-baseline-thumbnails
    # (cross-OS rendering), and program-backup (runs isolated in e2e-backup).
    # accessibility + fatigue-stage4-smokes +
    # volume-progress were promoted here in A10 after a 5x-repeat ubuntu stability
    # probe (225/225 green, zero flakes). nav-dropdown was promoted after the
    # issue #8 1440px actionability fix; sharding remains `--shard=${{ matrix.shard }}/2`.
    # No --reporter flag: the CI-gated reporters in playwright.config.ts (list +
    # html + junit) must all emit so the artifact upload below has a report.
    - name: Run functional specs (shard ${{ matrix.shard }}/2)
      run: |
        npx playwright test --project=chromium --shard=${{ matrix.shard }}/2 \
          e2e/accessibility.spec.ts \
          e2e/api-integration.spec.ts \
          e2e/body-composition.spec.ts \
          e2e/browser-navigation-state.spec.ts \
          e2e/dark-mode.spec.ts \
          e2e/empty-states.spec.ts \
          e2e/error-handling.spec.ts \
          e2e/exercise-interactions.spec.ts \
          e2e/fatigue-stage4-smokes.spec.ts \
          e2e/fatigue.spec.ts \
          e2e/learned-calibration.spec.ts \
          e2e/nav-dropdown.spec.ts \
          e2e/progression.spec.ts \
          e2e/replace-exercise-errors.spec.ts \
          e2e/smoke-navigation.spec.ts \
          e2e/summary-pages.spec.ts \
          e2e/superset-edge-cases.spec.ts \
          e2e/ui-hardening.spec.ts \
          e2e/user-profile.spec.ts \
          e2e/validation-boundary.spec.ts \
          e2e/volume-progress.spec.ts \
          e2e/volume-splitter.spec.ts \
          e2e/workout-log.spec.ts \
          e2e/workout-plan.spec.ts

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-functional-shard-${{ matrix.shard }}-of-2
        path: artifacts/playwright
        retention-days: 7

  # Fan-in gate (leftovers A11). This job is the SINGLE branch-protection
  # required status check for functional E2E — its name "E2E Functional
  # (Chromium)" must stay byte-for-byte (renaming it orphans the required check
  # and blocks every PR; same rule as the typecheck job). It contains no test
  # logic: it just aggregates the matrix result. `needs.<matrix-job>.result` is
  # 'success' only when ALL shards succeeded, so this gate is green iff both
  # shards passed. `if: always()` makes the gate run (and post its status) even
  # when a shard fails, so the required check turns red instead of staying
  # pending. Do NOT add the per-shard "E2E Functional Shard i/2" contexts to
  # branch protection — this gate is the contract.
  e2e-functional:
    name: E2E Functional (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: e2e-functional-shard
    if: always()

    steps:
    - name: Require all functional shards to pass
      run: |
        result="${{ needs.e2e-functional-shard.result }}"
        echo "e2e-functional-shard matrix aggregate result: $result"
        if [ "$result" != "success" ]; then
          echo "::error title=E2E Functional gate::One or more E2E Functional shards did not pass (result=$result)"
          exit 1
        fi
        echo "All E2E Functional shards passed."

  e2e-backup:
    name: E2E Backup (Chromium, isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: frontend-build

    # program-backup.spec.ts performs live backup/restore mutations. It runs in
    # its OWN job so it gets a fresh server + freshly-seeded throwaway DB,
    # sidestepping the documented sequential-DB pollution flake without any
    # between-spec reset mechanism. See e2e/CLAUDE.md.
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install npm dependencies
      run: npm ci

    - name: Build Bootstrap-customized CSS
      run: npm run build:css

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Run backup spec
      run: npx playwright test e2e/program-backup.spec.ts --project=chromium

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-backup
        path: artifacts/playwright
        retention-days: 7

  # Track B WPB.9 (OD9, docs/REFACTOR_PLAN.md) step 1: land fatigue-context.spec.ts
  # in CI as a NEW, NON-required job so it starts accumulating green runs on PRs.
  # Mirrors the e2e-backup idiom above (an isolated single-spec job with its own
  # fresh server + throwaway DB via playwright.config.ts's webServer command) rather
  # than the e2e-functional-shard matrix idiom: adding a spec to that matrix's list
  # feeds the "E2E Functional (Chromium)" fan-in gate, which IS a required
  # branch-protection context — that would promote this spec to required
  # immediately, skipping the green-run observation window OD9 calls for. Step 1
  # landed in PR #100; after ten consecutive green PRs (#100-#109), the existing
  # context became required on 2026-07-05. Its historical job name is now
  # load-bearing branch-protection configuration and must not be renamed.
  e2e-fatigue-context:
    name: E2E Fatigue Context (Chromium, non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: frontend-build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install npm dependencies
      run: npm ci

    - name: Build Bootstrap-customized CSS
      run: npm run build:css

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Run fatigue-context spec
      run: npx playwright test e2e/fatigue-context.spec.ts --project=chromium --reporter=line

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-fatigue-context
        path: artifacts/playwright
        retention-days: 7

  # Track B WPB.8 (OD8, docs/REFACTOR_PLAN.md): erase-flow.spec.ts drives the
  # POST /erase-data full reset, which wipes the live DB mid-run — the same
  # destructive-mutation reason program-backup.spec.ts runs isolated in
  # e2e-backup above. It must therefore NEVER join the e2e-functional-shard
  # spec lists. Mirrors the e2e-fatigue-context idiom: an isolated single-spec
  # job with its own fresh server + throwaway DB (playwright.config.ts
  # webServer command).
  #
  # PROMOTED TO REQUIRED on 2026-08-01 (decision D2, signed; Phase 0 step 4 of
  # docs/TESTING_STRATEGY_PLANNING.md). It guards the most destructive endpoint
  # in the application: the production confirm-guard, the 400 path and the
  # auto_backup response payload were reachable only through this job.
  #
  # THE "(non-required)" IN THE JOB NAME BELOW IS NOW FALSE, AND MUST STAY.
  # The name is the exact branch-protection context string; renaming it orphans
  # the required check and blocks every open pull request. This is the same
  # load-bearing lie e2e-fatigue-context carries — that job has been required
  # since 2026-07-05 while still calling itself non-required. Promotion is a
  # protection-API change, never a YAML rename (TESTING_STRATEGY_PLANNING.md 8.3).
  e2e-erase-flow:
    name: E2E Erase Flow (Chromium, isolated, non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: frontend-build

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install npm dependencies
      run: npm ci

    - name: Build Bootstrap-customized CSS
      run: npm run build:css

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    - name: Run erase-flow spec
      run: npx playwright test e2e/erase-flow.spec.ts --project=chromium --reporter=line

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: playwright-erase-flow
        path: artifacts/playwright
        retention-days: 7

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        # WP4.4's immutable baseline contract verifies the seven shared CSS
        # surfaces at the merged Packet-a commit via `git show`.
        fetch-depth: 0
      
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: '.python-version'
        cache: 'pip'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    # Phase 1 step 5 of docs/TESTING_STRATEGY_PLANNING.md, decision D1 (signed
    # 2026-08-01): coverage is NON-BLOCKING MEASUREMENT. There is deliberately no
    # --cov-fail-under and no threshold of any kind -- this job's verdict is still
    # exactly "did the tests pass". The observed number is the baseline for a
    # future baseline-diff ratchet (the scripts/pyright_baseline_diff.py pattern
    # this repo already proves), not a line anyone has to stay above today. The
    # phase-3 decision that ruled coverage out is reversed only this far.
    #
    # Scope is utils + routes. app.py is deliberately ABSENT: pytest never imports
    # it, so coverage answers --cov=app with "Module app was never imported" and
    # no row at all. Its one import site is the app_client fixture at
    # tests/test_pattern_coverage.py:329, which no test in that class requests --
    # a dead fixture. That is blindspot B2 surfacing in the coverage data, and it
    # is recorded in section 8.6 rather than papered over with a permanent warning.
    - name: Run pytest with coverage
      run: |
        pytest tests/ -v --tb=short --junitxml=artifacts/pytest/junit.xml \
          --cov=utils --cov=routes \
          --cov-report=term \
          --cov-report=xml:artifacts/pytest/coverage.xml \
          --cov-report=html:artifacts/pytest/htmlcov
      env:
        PYTHONPATH: ${{ github.workspace }}

    # Measure-only reporting. Never fails: `if: always()` so a red test suite
    # still publishes whatever coverage was collected, and the script itself
    # cannot fail the job.
    - name: Summarize coverage (measure-only)
      if: always()
      continue-on-error: true
      run: |
        python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import xml.etree.ElementTree as ET

        # The four surfaces Phase 1 step 5 names as core, corrected against the
        # tree: the plan says "utils/double_progression*", which does not exist.
        # The double-progression logic lives in utils/progression_plan.py.
        CORE_PREFIXES = (
            "utils/effective_sets",
            "utils/progression_plan",
            "utils/volume_",
            "utils/program_backup",
        )

        try:
            root = ET.parse("artifacts/pytest/coverage.xml").getroot()
        except Exception as exc:
            print("### Coverage\n\nNo coverage report was produced (%s)." % exc)
            raise SystemExit(0)

        overall = float(root.get("line-rate", 0)) * 100
        classes = []
        for cls in root.iter("class"):
            name = (cls.get("filename") or "").replace("\\", "/")
            classes.append((name, float(cls.get("line-rate", 0)) * 100))
        classes.sort()

        print("### Python coverage (measure-only — no threshold, D1)")
        print()
        print("**Overall: %.1f%%** across %d measured files." % (overall, len(classes)))
        print()
        print("| Core module | Coverage |")
        print("|---|---:|")
        for name, rate in classes:
            if name.startswith(CORE_PREFIXES):
                print("| `%s` | %.0f%% |" % (name, rate))
        print()
        weakest = sorted(classes, key=lambda c: c[1])[:8]
        print("<details><summary>Eight weakest modules</summary>")
        print()
        print("| Module | Coverage |")
        print("|---|---:|")
        for name, rate in weakest:
            print("| `%s` | %.0f%% |" % (name, rate))
        print()
        print("</details>")
        print()
        print("No threshold is enforced. This number is the baseline for a future")
        print("baseline-diff ratchet; see TESTING_STRATEGY_PLANNING.md section 8.6.")
        PY

    - name: Upload pytest JUnit XML
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pytest-junit
        path: artifacts/pytest/junit.xml
        retention-days: 7

    - name: Upload coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: pytest-coverage
        path: |
          artifacts/pytest/coverage.xml
          artifacts/pytest/htmlcov
        retention-days: 14

  # NOTE: the former `dependency-check` job (outdated/safety scans) moved to the
  # manual Deep Gate (.github/workflows/deep-gate.yml) in Phase 4.5 — it's
  # informational and doesn't belong on the required PR path. It was never a
  # required status check, so branch protection is unaffected.

  # Static typing gate (Phase 3, docs/archive/ci_cd/phase3/PLANNING.md).
  #   tsc --noEmit -> BLOCKING (backlog cleared to 0 in the tsc fast-follow).
  #   pyright      -> count is still surfaced measure-only to the job summary +
  #                   artifact (full backlog), AND gated blocking via a
  #                   baseline-allowlist (leftovers A9): the committed baseline
  #                   docs/ci_cd_phase3/pyright-baseline.json allowlists the
  #                   existing backlog; scripts/pyright_baseline_diff.py fails the
  #                   job only on NET-NEW diagnostics. Existing errors never red
  #                   the build; a regression does.
  # The recorded pyright count is 1.1.410 under the committed pyrightconfig.json
  # (py3.14 + Windows platform — pythonVersion aligned to the CI runtime).
  # The baseline-diff keys on file+rule+message+
  # severity (repo-relative POSIX path), counted as a multiset, so it reproduces
  # across Windows/Linux. Regenerate the baseline with --write-baseline when an
  # intentional, reviewed change shifts the backlog.
  typecheck:
    # NOTE: this job name is a branch-protection *required status check* context —
    # keep it byte-for-byte ("Type Check (tsc blocking + pyright measure-only)").
    # Renaming it orphans the required check and blocks every PR. pyright is now
    # also baseline-gated (see the blocking diff step below); the name stays for
    # protection-matching, not because pyright is purely measure-only.
    name: Type Check (tsc blocking + pyright measure-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        # Read the exact patch-level runtime from the repository-wide contract.
        # Pyright itself targets the corresponding 3.14 language/stdlib surface.
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # pyrightconfig.json pins venv ".venv"; create + populate it so pyright
    # resolves third-party imports the same way it does on the developer's box.
    - name: Create .venv and install Python dependencies
      run: |
        python -m venv .venv
        .venv/bin/python -m pip install --upgrade pip
        .venv/bin/python -m pip install -r requirements.txt

    - name: Install npm dependencies
      run: npm ci

    - name: pyright (measure-only count)
      continue-on-error: true
      run: |
        npx pyright@1.1.410 --outputjson > pyright.json 2> pyright.stderr.txt || true
        COUNT=$(python -c "import json; print(json.load(open('pyright.json'))['summary']['errorCount'])" 2>/dev/null || echo "unknown")
        echo "::notice title=pyright (measure-only count)::pyright 1.1.410 reported $COUNT errors (py3.14 config); the baseline-diff step gates NET-NEW errors only"
        {
          echo "### pyright (measure-only count + baseline-gated)"
          echo "- **total errors**: $COUNT (pyright 1.1.410, py3.14 + Windows-platform config)"
          echo "- Blocking gate: net-new vs docs/ci_cd_phase3/pyright-baseline.json (next step)."
        } >> "$GITHUB_STEP_SUMMARY"

    # BLOCKING (leftovers A9): fail only on NET-NEW pyright diagnostics vs the
    # committed baseline. Consumes pyright.json from the measure-only step above
    # (written even though that step is continue-on-error). The committed baseline
    # allowlists the existing backlog, so this never reds the build on current
    # code — only a regression (new error or an increased count for a key) fails.
    - name: pyright baseline diff (blocking)
      run: |
        python scripts/pyright_baseline_diff.py \
          --current pyright.json \
          --baseline docs/ci_cd_phase3/pyright-baseline.json

    # BLOCKING: backlog was cleared to 0 in the tsc fast-follow. A non-zero count
    # fails the job. The count is still written to the summary + uploaded (the
    # artifact step is if: always()) so a regression shows what broke.
    - name: tsc --noEmit (blocking)
      run: |
        set +e
        npx tsc --noEmit > tsc.txt 2>&1
        STATUS=$?
        set -e
        COUNT=$(grep -cE "error TS[0-9]+" tsc.txt || true)
        echo "::notice title=tsc (blocking)::tsc --noEmit reported $COUNT errors (e2e + playwright.config.ts scope)"
        {
          echo "### tsc --noEmit (blocking)"
          echo "- **errors**: $COUNT (scope: e2e specs + playwright.config.ts; app JS under static/js/modules/* is NOT covered)"
        } >> "$GITHUB_STEP_SUMMARY"
        cat tsc.txt
        exit $STATUS

    - name: Upload static-analysis outputs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: static-analysis-typecheck
        path: |
          pyright.json
          tsc.txt
        retention-days: 14

  # Refactor Plan v3 WP3.1: Vitest scaffold for plain-JS unit tests (no
  # TypeScript). Runs `npm run test:js` (vitest run) against the seeded pure-helper
  # suite under static/js/**/*.test.js. Deliberately a NEW, NON-required job: it is
  # NOT added to branch protection's required_status_checks, so it starts
  # accumulating green runs without blocking merges while the JS test track is
  # young (same green-run pattern as the e2e-*-context/erase jobs). The name below
  # is new configuration; it renames no existing (load-bearing) required context.
  js-unit:
    name: JS Unit (Vitest, non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install npm dependencies
      run: npm ci

    # Phase 1 step 6 of docs/TESTING_STRATEGY_PLANNING.md. REPORT-ONLY: no
    # coverage thresholds are configured in vitest.config.js, so this cannot fail
    # on a number. The job also stays NON-REQUIRED -- decision D2's js-unit half
    # is explicitly NOT signed, and §5 step 12 wants two weeks of green plus real
    # jsdom module tests before that conversation.
    #
    # Expect a very low figure: only 8 of 49 modules have any test (blindspot B7).
    # That number is the argument for Phase 3 step 12, not a problem to fix here.
    - name: Run Vitest with coverage
      run: npm run test:js -- --coverage

    - name: Summarize JS coverage (measure-only)
      if: always()
      continue-on-error: true
      run: |
        node -e "
          const fs = require('fs');
          const p = 'artifacts/js-coverage/coverage-summary.json';
          if (!fs.existsSync(p)) {
            console.log('::warning title=JS coverage::No coverage summary was produced.');
            process.exit(0);
          }
          const s = JSON.parse(fs.readFileSync(p, 'utf8'));
          const t = s.total;
          const files = Object.keys(s).filter(k => k !== 'total');
          const zero = files.filter(k => s[k].statements.pct === 0);
          const pct = m => t[m].pct.toFixed(1) + '%';
          console.log('::notice title=JS coverage (measure-only)::statements=' + pct('statements') + ' branches=' + pct('branches') + ' functions=' + pct('functions') + ' lines=' + pct('lines'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### JS coverage (measure-only — no thresholds, non-required job)\n\n' +
            '| Metric | Coverage |\n|---|---:|\n' +
            '| statements | ' + pct('statements') + ' |\n' +
            '| branches | ' + pct('branches') + ' |\n' +
            '| functions | ' + pct('functions') + ' |\n' +
            '| lines | ' + pct('lines') + ' |\n\n' +
            '**' + zero.length + ' of ' + files.length + ' modules have 0% coverage.**\n\n' +
            'A low number here is the expected finding, not a regression: only a handful of\n' +
            'modules under static/js have any unit test at all (blindspot B7). This figure is\n' +
            'the argument for Phase 3 step 12; see TESTING_STRATEGY_PLANNING.md section 8.6.\n');
        "

    - name: Upload JS coverage report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: js-coverage
        path: artifacts/js-coverage
        retention-days: 14

  # Refactor Plan v3 WP4.1: pinned stylelint measurement for the hand-authored
  # CSS/SCSS surface. This is a NEW, NON-required job and renames no existing
  # required context. Existing debt is reported against the committed baseline;
  # neither warnings nor tool/parser failures block the workflow in this WP.
  css-stylelint-measure:
    name: CSS Stylelint Measurement (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install npm dependencies
      run: npm ci

    - name: Measure CSS and SCSS debt
      run: |
        mkdir -p artifacts/stylelint
        set +e
        npx stylelint "static/css/**/*.css" "scss/**/*.scss" \
          --formatter json \
          --output-file artifacts/stylelint/stylelint.json \
          >/dev/null 2>&1
        STATUS=$?
        set -e
        echo "$STATUS" > artifacts/stylelint/exit-code.txt
        echo "::notice title=stylelint (non-blocking)::stylelint exited $STATUS; warnings are measure-only in WP4.1"

    - name: Summarize against committed baseline
      if: always()
      continue-on-error: true
      run: |
        node scripts/stylelint-report.mjs \
          artifacts/stylelint/stylelint.json \
          artifacts/stylelint/summary.json \
          docs/CSS_PHASE4_WP4_1_STYLELINT_BASELINE.json

    - name: Upload stylelint measurement
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: static-analysis-stylelint
        path: artifacts/stylelint
        retention-days: 14

  # Phase 0.1 of docs/TESTING_STRATEGY_PLANNING.md (blindspot B3: five mutually
  # contradictory hand-maintained test counts). scripts/generate_test_inventory.py
  # is the single producer of those numbers; this job regenerates the inventory on
  # Linux and diffs it against what the branch committed from Windows. A green
  # check is also the cross-platform determinism proof required by section 7.3
  # entry criterion 1.
  #
  # MEASURE-ONLY BY DESIGN, not by oversight. Two other plans --
  # docs/APP_PY_REVIEW_PLAN.md packets P1-P5 and WPB.4 -- are adding tests right
  # now, and a drift gate that reds their pull requests for legitimately moving a
  # count is exactly what section 8.4 promised not to do.
  #
  # "Measure-only" here means GENUINELY GREEN, not merely non-blocking.
  # continue-on-error alone still renders a red X in the checks list, which reads
  # as a failure to everyone else even though it blocks nothing. So the drift step
  # captures its own exit code and reports through ::warning + the job summary,
  # the same idiom css-stylelint-measure already uses. continue-on-error stays as
  # a backstop for an unexpected tool crash.
  #
  # FLIP TO BLOCKING once BOTH of those plans have merged and the committed
  # inventory has been regenerated to match: change `exit 0` to `exit $STATUS` in
  # the drift step and drop continue-on-error. Section 8.4 is the record.
  #
  # This job is NEW and non-required; it renames no existing (load-bearing)
  # branch-protection context.
  #
  # Deliberately no browser install and no Flask server: `playwright test --list`
  # only parses specs and `pytest --collect-only` imports without running, so this
  # job never binds port 5000 (section 8.2) and stays cheap.
  test-inventory:
    name: Test Inventory Drift (non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install npm dependencies
      run: npm ci

    # Measure-only: the drift verdict is an annotation, not a failed step. Swap
    # `exit 0` for `exit $STATUS` to flip this gate to blocking (see the flip
    # condition in the job comment above).
    - name: Check committed inventory against a fresh Linux regeneration
      run: |
        set +e
        python scripts/generate_test_inventory.py --check > inventory_drift.txt 2>&1
        STATUS=$?
        set -e
        cat inventory_drift.txt
        if [ "$STATUS" -ne 0 ]; then
          echo "::warning title=Test inventory drift (measure-only)::The committed inventory does not match a fresh regeneration. Run scripts/generate_test_inventory.py and commit the result. Not blocking: see TESTING_STRATEGY_PLANNING.md 8.4."
          {
            echo "### Test inventory drift (measure-only — not blocking)"
            echo
            echo '```'
            head -c 8000 inventory_drift.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        else
          echo "::notice title=Test inventory::Committed inventory matches a fresh Linux regeneration."
        fi
        exit 0

    - name: Report totals and regenerate for the artifact
      if: always()
      run: |
        python scripts/generate_test_inventory.py
        python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
        import json
        d = json.load(open("docs/test_inventory/TEST_INVENTORY.json"))
        pw, py, hw = d["playwright"], d["pytest"], d["hard_waits"]
        req = pw["required_functional_set"]
        print("### Test inventory (measure-only)")
        print()
        print("| Metric | Linux regeneration |")
        print("|---|---|")
        print(f"| Playwright tests (chromium) | {pw['total_tests']} across {pw['total_spec_files']} specs |")
        print(f"| Required functional gate | {req['tests']} tests across {req['spec_files']} specs |")
        print(f"| pytest collected nodes | {py['collected_deterministic']} across {py['deterministic_files']} files (deterministic subset of {py['total_files']}) |")
        print(f"| Hard waits ({hw['metric']}) | {hw['total_lines']} across {hw['files_with_waits']} files |")
        print()
        print("Drift against the committed inventory is reported in the previous step as a warning.")
        print("Measure-only until APP_PY P1-P5 and WPB.4 merge (TESTING_STRATEGY_PLANNING.md 8.4).")
        PY

    - name: Upload drift report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-inventory-drift
        path: inventory_drift.txt
        retention-days: 14

    - name: Upload regenerated inventory
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-inventory
        path: docs/test_inventory
        retention-days: 14

  # Phase 0.3 of docs/TESTING_STRATEGY_PLANNING.md, closing the other half of
  # blindspot B10: pip-audit has gated every PR for a while, but the JS dependency
  # graph had no vulnerability scanning at all.
  #
  # NEVER add --omit=dev. This is the sol5.6 P1 finding and it is not theoretical
  # here: `npm audit --json` reports dependencies {prod: 1, dev: 246}, so omitting
  # dev scans ONE package out of 246 and prints "found 0 vulnerabilities" while
  # four high-severity advisories sit in the graph the build actually uses. That
  # false green is worse than no scan, because it looks like a closed gap.
  #
  # MEASURE-ONLY: the audit's verdict is a ::warning plus a job summary, never a
  # failed step -- same idiom as css-stylelint-measure and test-inventory. Making
  # it blocking needs a documented severity/exception policy first (Phase 0 step 3),
  # which is not in this signed slice: every finding today is a transitive
  # devDependency of the build/test toolchain, so a blocking gate would stop all
  # merges over something that never reaches a user's machine. Swap `exit 0` for
  # `exit $STATUS` once that policy exists.
  #
  # NEW and non-required; renames no existing branch-protection context.
  js-supply-chain:
    name: JS Supply Chain (npm audit, non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # No `npm ci`: `npm audit` resolves the committed package-lock.json against
    # the advisory database directly, so installing first buys nothing.
    - name: Audit the full dependency graph (including devDependencies)
      run: |
        mkdir -p artifacts/npm-audit
        set +e
        npm audit --json > artifacts/npm-audit/npm-audit.json 2>artifacts/npm-audit/npm-audit.err
        STATUS=$?
        npm audit > artifacts/npm-audit/npm-audit.txt 2>&1
        set -e
        cat artifacts/npm-audit/npm-audit.txt
        node -e "
          const fs = require('fs');
          let r;
          try { r = JSON.parse(fs.readFileSync('artifacts/npm-audit/npm-audit.json', 'utf8')); }
          catch (e) {
            console.log('::warning title=npm audit::Could not parse npm audit JSON: ' + e.message);
            process.exit(0);
          }
          const v = r.metadata.vulnerabilities;
          const d = r.metadata.dependencies;
          const sev = ['critical', 'high', 'moderate', 'low', 'info'];
          const line = sev.map(s => s + '=' + v[s]).join(' ');
          console.log('::notice title=npm audit (measure-only)::' + line + ' total=' + v.total);
          if (v.total > 0) {
            console.log('::warning title=npm audit (measure-only)::' + v.total + ' advisories in the full dependency graph (' + line + '). Not blocking: a severity/exception policy is required first, see TESTING_STRATEGY_PLANNING.md Phase 0 step 3.');
          }
          const rows = sev.map(s => '| ' + s + ' | ' + v[s] + ' |').join('\n');
          const names = Object.keys(r.vulnerabilities || {}).sort();
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### npm audit — full graph, measure-only\n\n' +
            '| Severity | Count |\n|---|---:|\n' + rows + '\n| **total** | **' + v.total + '** |\n\n' +
            'Scanned **' + d.total + '** dependencies (prod ' + d.prod + ', dev ' + d.dev + ', optional ' + d.optional + ').\n\n' +
            (names.length ? 'Affected packages: ' + names.map(n => '\`' + n + '\`').join(', ') + '\n\n' : '') +
            '\`--omit=dev\` is deliberately NOT used: it would scan ' + d.prod + ' of ' + d.total +
            ' packages and report a false clean bill of health.\n');
        "
        exit 0

    - name: Upload npm audit report
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: js-supply-chain-npm-audit
        path: artifacts/npm-audit
        retention-days: 14

