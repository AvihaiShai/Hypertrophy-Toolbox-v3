name: A2 native rehearsal
on:
  push:
    branches: [rehearsal/a2-native-20261020]
permissions:
  contents: read
jobs:
  worktree-windows:
    name: Operation A Windows Tests
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Install dependencies
      run: python -m pip install -r requirements.txt

    - name: Require Windows PowerShell and PowerShell 7
      shell: pwsh
      run: |
        foreach ($hostName in @('powershell', 'pwsh')) {
          $executable = (Get-Command $hostName -ErrorAction Stop).Source
          & $executable -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        }

    # Linux's full suite retains portable snapshot/scope/path-refusal tests.
    # Native identities, junctions and creator/launcher contracts execute here
    # under BOTH hosts. A skipped capability must fail this job, never green it.
    - name: Run Operation A tests on both Windows hosts
      shell: pwsh
      env:
        # Avoid user-profile TEMP aliases (for example RUNNER~1): the real
        # Windows validator deliberately rejects ambiguous short-name paths.
        TEMP: ${{ runner.temp }}
        TMP: ${{ runner.temp }}
        TMPDIR: ${{ runner.temp }}
        HT_RUNTIME_DIR: '${{ runner.temp }}/operation-a-runtime'
        PYTHONDONTWRITEBYTECODE: '1'
      run: |
        python -m pytest tests/test_worktree_environment_preflight.py tests/test_worktree_lifecycle.py tests/test_worktree_snapshot.py -n 4 --dist loadfile -v --tb=short --junitxml=artifacts/pytest/worktree-windows.xml
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Require executed coverage without skips
      if: always()
      run: python -m tests.worktree_cleanup.verify_ci_report artifacts/pytest/worktree-windows.xml

    - name: Upload Operation A Windows JUnit
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: operation-a-windows-junit
        path: artifacts/pytest/worktree-windows.xml
        if-no-files-found: error
        retention-days: 14
