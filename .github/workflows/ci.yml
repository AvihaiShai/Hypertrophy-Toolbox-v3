name: Q4 seeded failure rehearsal
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version-file: .python-version
        cache: pip
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt

        # PYSEC-2026-3447 affects setuptools 79.0.1; upgrade to the fixed release.

        python -m pip install --upgrade "setuptools>=83.0.0"

        '
    - name: Run pip-audit
      run: '# Pinned (B9): an unpinned runtime install left this REQUIRED gate''s

        # behaviour depending on whatever pip-audit released that morning.

        pip install pip-audit==2.10.1

        # CVE-2026-3219 in pip itself has no Fix Version yet (upstream has

        # not released a patched pip). Remove --ignore-vuln once `pip`

        # publishes a fix.

        pip-audit --desc --ignore-vuln CVE-2026-3219

        '
      continue-on-error: false
    if: ${{ false }}
  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version-file: .python-version
        cache: pip
    - name: Install dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt

        pip install flake8 pylint

        '
    - name: Lint with flake8
      run: '# Stop the build if there are Python syntax errors or undefined names, plus

        # the flipped-to-blocking rules: F811 (redefinition), E711 (== None),

        # E712 (== True/False), F401 (unused import). F811/E711/E712 sat at ~0;

        # F401 was flipped after a guardrailed cleanup PR drove its 56 findings to

        # 0 (removed unused test/source imports + deleted the stray replace.py).

        flake8 . --count --select=E9,F63,F7,F82,F811,E711,E712,F401 --show-source --statistics --exclude=.venv,venv,env,.git,__pycache__,node_modules,artifacts,build,dist

        # Exit-zero treats all errors as warnings

        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics --exclude=.venv,venv,env,.git,__pycache__,node_modules,artifacts,build,dist

        '
    - name: Flake8 diagnostics (non-blocking, measure-only)
      continue-on-error: true
      run: "EXCL=\".venv,venv,env,.git,__pycache__,node_modules,artifacts,build,dist\"\nflake8 . --select=F841 --count --statistics\
        \ --exclude=\"$EXCL\" > flake8_idiom.txt 2>&1 || true\nIDIOM=$(tail -1 flake8_idiom.txt | tr -d '[:space:]')\necho\
        \ \"::notice title=flake8 diagnostics (non-blocking)::F841 idiom=$IDIOM\"\n{\n  echo \"### flake8 diagnostics (non-blocking\
        \ \u2014 measure-only)\"\n  echo \"- **F841**: $IDIOM \u2014 expected \\`except ... as e\\` idiom, not a flip candidate\"\
        \n} >> \"$GITHUB_STEP_SUMMARY\"\necho \"===== F841 (idiom) =====\"; cat flake8_idiom.txt\n"
    - name: Upload flake8 diagnostics
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: static-analysis-flake8
        path: 'flake8_idiom.txt

          '
        retention-days: 14
    if: ${{ false }}
  workflow-lint:
    name: Workflow Lint (actionlint + zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
      ZIZMOR_VERSION: 1.30.1
      ZIZMOR_SHA256: e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a
      SHELLCHECK_VERSION: v0.11.0
      SHELLCHECK_SHA256: b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Install pinned workflow linters
      run: "set -euo pipefail\ncd \"$RUNNER_TEMP\"\ncurl --fail --silent --show-error --location --proto '=https' --proto-redir\
        \ '=https' \\\n  --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 -o actionlint.tar.gz \\\n  \"https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz\"\
        \ncurl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \\\n  --retry 3 --retry-all-errors\
        \ --connect-timeout 15 --max-time 120 -o zizmor.tar.gz \\\n  \"https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz\"\
        \ncurl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \\\n  --retry 3 --retry-all-errors\
        \ --connect-timeout 15 --max-time 120 -o shellcheck.tar.gz \\\n  \"https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.gz\"\
        \nprintf '%s  %s\\n' \\\n  \"$ACTIONLINT_SHA256\" actionlint.tar.gz \\\n  \"$ZIZMOR_SHA256\" zizmor.tar.gz \\\n  \"\
        $SHELLCHECK_SHA256\" shellcheck.tar.gz \\\n  | sha256sum --check --strict\nmkdir -p workflow-lint-bin\ntar -xzf actionlint.tar.gz\
        \ -C workflow-lint-bin actionlint\ntar -xzf zizmor.tar.gz -C workflow-lint-bin zizmor\ntar -xzf shellcheck.tar.gz\
        \ -C workflow-lint-bin --strip-components=1 \"shellcheck-${SHELLCHECK_VERSION}/shellcheck\"\nworkflow-lint-bin/actionlint\
        \ -version\nworkflow-lint-bin/zizmor --version\nworkflow-lint-bin/shellcheck --version\n"
    - name: actionlint
      run: '"$RUNNER_TEMP/workflow-lint-bin/actionlint" -color -shellcheck="$RUNNER_TEMP/workflow-lint-bin/shellcheck" -pyflakes=

        '
    - name: zizmor (min severity medium)
      if: ${{ !cancelled() }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: '"$RUNNER_TEMP/workflow-lint-bin/zizmor" --min-severity medium --format plain .github/workflows .github/dependabot.yml

        '
    if: ${{ false }}
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ false }}
    permissions:
      contents: read
    steps:
    - name: Review dependency changes
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
      with:
        fail-on-severity: high
        fail-on-scopes: runtime, development, unknown
        warn-only: false
        vulnerability-check: true
        license-check: false
        show-openssf-scorecard: false
        comment-summary-in-pr: never
        retry-on-snapshot-warnings: false
  frontend-build:
    name: Frontend Build (npm ci + SCSS)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
        cache: npm
    - name: Install npm dependencies
      run: npm ci
    - name: Remove the tracked CSS build output before rebuilding
      run: "rm -f \\\n  static/css/bootstrap.custom.min.css \\\n  static/css/bootstrap.custom.min.css.map\n"
    - name: Build Bootstrap-customized CSS
      run: npm run build:css
    - name: Fail on compiled-CSS drift
      run: "set +e\ngit diff --exit-code --stat -- \\\n  static/css/bootstrap.custom.min.css \\\n  static/css/bootstrap.custom.min.css.map\n\
        STATUS=$?\nset -e\nif [ \"$STATUS\" -ne 0 ]; then\n  echo \"::error title=Compiled CSS drift::static/css/bootstrap.custom.min.css\
        \ and/or its .map do not match a fresh 'npm run build:css'. Rebuild and commit both artifacts.\"\n  {\n    echo \"\
        ### Compiled SCSS drift \u2014 blocking\"\n    echo\n    # shellcheck disable=SC2016 # backticks are literal Markdown,\
        \ not substitution\n    echo 'The committed bundle does not match what `npm run build:css` produces from'\n    # shellcheck\
        \ disable=SC2016 # backticks are literal Markdown, not substitution\n    echo '`scss/custom-bootstrap.scss`. Run the\
        \ build and commit **both** regenerated'\n    echo 'artifacts in the same PR that changed the SCSS:'\n    echo\n \
        \   echo '```'\n    echo 'npm run build:css'\n    echo 'git add static/css/bootstrap.custom.min.css static/css/bootstrap.custom.min.css.map'\n\
        \    echo '```'\n    echo\n    echo 'Do not edit the compiled files by hand, and do not relax this gate.'\n  } >>\
        \ \"$GITHUB_STEP_SUMMARY\"\nelse\n  echo \"::notice title=Compiled CSS::The committed bundle and map match a fresh\
        \ 'npm run build:css'.\"\nfi\nexit $STATUS\n"
    if: ${{ false }}
  e2e-smoke:
    name: E2E Smoke (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: frontend-build
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version-file: .python-version
        cache: pip
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
        cache: npm
    - name: Install Python dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt

        '
    - name: Install npm dependencies
      run: npm ci
    - name: Build Bootstrap-customized CSS
      run: npm run build:css
    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium
    - name: Run smoke spec
      run: npx playwright test e2e/smoke-navigation.spec.ts --project=chromium --reporter=line
    if: ${{ false }}
  e2e-functional-shard:
    name: E2E Functional Shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: frontend-build
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
        - 3
        - 4
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version-file: .python-version
        cache: pip
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
        cache: npm
    - name: Install Python dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt

        '
    - name: Install npm dependencies
      run: npm ci
    - name: Build Bootstrap-customized CSS
      run: npm run build:css
    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium
    - name: Run functional specs (shard ${{ matrix.shard }}/4)
      run: "npx playwright test --project=chromium --shard=${{ matrix.shard }}/4 \\\n  e2e/accessibility.spec.ts \\\n  e2e/api-integration.spec.ts\
        \ \\\n  e2e/body-composition.spec.ts \\\n  e2e/browser-navigation-state.spec.ts \\\n  e2e/dark-mode.spec.ts \\\n \
        \ e2e/empty-states.spec.ts \\\n  e2e/error-handling.spec.ts \\\n  e2e/exercise-interactions.spec.ts \\\n  e2e/fatigue-stage4-smokes.spec.ts\
        \ \\\n  e2e/fatigue.spec.ts \\\n  e2e/learned-calibration.spec.ts \\\n  e2e/nav-dropdown.spec.ts \\\n  e2e/progression.spec.ts\
        \ \\\n  e2e/replace-exercise-errors.spec.ts \\\n  e2e/smoke-navigation.spec.ts \\\n  e2e/summary-pages.spec.ts \\\n\
        \  e2e/superset-edge-cases.spec.ts \\\n  e2e/ui-hardening.spec.ts \\\n  e2e/user-profile.spec.ts \\\n  e2e/validation-boundary.spec.ts\
        \ \\\n  e2e/visual-field-separator.spec.ts \\\n  e2e/volume-progress.spec.ts \\\n  e2e/volume-splitter.spec.ts \\\n\
        \  e2e/workout-log.spec.ts \\\n  e2e/workout-plan.spec.ts\n"
    - name: Summarize shard timing
      if: always()
      run: "python scripts/playwright_timing_report.py \\\n  --junit artifacts/playwright/junit.xml \\\n  --shards 1 --top\
        \ 12 --markdown \\\n  --label \"shard ${{ matrix.shard }}/4 (required set)\" >> \"$GITHUB_STEP_SUMMARY\" || true\n"
    - name: Upload functional JUnit
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: playwright-functional-report-shard-${{ matrix.shard }}-of-4
        path: artifacts/playwright/junit.xml
        if-no-files-found: error
        retention-days: 7
    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: playwright-functional-shard-${{ matrix.shard }}-of-4
        path: artifacts/playwright
        retention-days: 7
    if: ${{ false }}
  e2e-functional:
    name: E2E Functional (Chromium)
    permissions: {}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: e2e-functional-shard
    if: ${{ false }}
    steps:
    - name: Require all functional shards to pass
      run: "result=\"${{ needs.e2e-functional-shard.result }}\"\necho \"e2e-functional-shard matrix aggregate result: $result\"\
        \nif [ \"$result\" != \"success\" ]; then\n  echo \"::error title=E2E Functional gate::One or more E2E Functional\
        \ shards did not pass (result=$result)\"\n  exit 1\nfi\necho \"All E2E Functional shards passed.\"\n"
  e2e-backup:
    name: E2E Backup (Chromium, isolated)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: frontend-build
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version-file: .python-version
        cache: pip
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
        cache: npm
    - name: Install Python dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt

        '
    - name: Install npm dependencies
      run: npm ci
    - name: Build Bootstrap-customized CSS
      run: npm run build:css
    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium
    - name: Run backup spec
      run: npx playwright test e2e/program-backup.spec.ts --project=chromium
    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: playwright-backup
        path: artifacts/playwright
        retention-days: 7
    if: ${{ false }}
  e2e-fatigue-context:
    name: E2E Fatigue Context (Chromium, non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: frontend-build
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version-file: .python-version
        cache: pip
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
        cache: npm
    - name: Install Python dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt

        '
    - name: Install npm dependencies
      run: npm ci
    - name: Build Bootstrap-customized CSS
      run: npm run build:css
    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium
    - name: Run fatigue-context spec
      run: npx playwright test e2e/fatigue-context.spec.ts --project=chromium --reporter=line
    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: playwright-fatigue-context
        path: artifacts/playwright
        retention-days: 7
    if: ${{ false }}
  e2e-erase-flow:
    name: E2E Erase Flow (Chromium, isolated, non-required)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: frontend-build
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version-file: .python-version
        cache: pip
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
        cache: npm
    - name: Install Python dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt

        '
    - name: Install npm dependencies
      run: npm ci
    - name: Build Bootstrap-customized CSS
      run: npm run build:css
    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium
    - name: Run erase-flow spec
      run: npx playwright test e2e/erase-flow.spec.ts --project=chromium --reporter=line
    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: playwright-erase-flow
        path: artifacts/playwright
        retention-days: 7
    if: ${{ false }}
  visual-windows:
    name: Visual Regression (Windows baselines)
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version-file: .python-version
        cache: pip
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
      with:
        node-version: '24'
        cache: npm
    - name: Install Python dependencies
      run: 'python -m pip install --upgrade pip

        pip install -r requirements.txt

        '
    - name: Install npm dependencies
      run: npm ci
    - name: Build Bootstrap-customized CSS
      run: npm run build:css
    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium
    - name: Assert committed visual seed present
      run: if (-not (Test-Path 'e2e/fixtures/database.visual.seed.db')) { throw 'visual seed fixture missing' }
      shell: pwsh
    - name: Run Windows visual suite (compare only)
      env:
        PW_VISUAL_SEED: '1'
        PW_PORT: '5057'
        PW_DB_PATH: artifacts/e2e/database.visual-windows.db
      run: npx playwright test --project=chromium e2e/visual.spec.ts
      shell: pwsh
    - name: Assert no baseline was written
      if: always()
      run: '$changed = git status --porcelain -- e2e/__screenshots__

        if ($changed) { Write-Host $changed; throw ''CI wrote to e2e/__screenshots__; baselines are owner-local and must never
        be produced here'' }

        '
      shell: pwsh
    - name: Upload Playwright report + diffs
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: playwright-visual-windows
        path: artifacts/playwright
        retention-days: 7
    if: ${{ false }}
  worktree-windows:
    name: Operation A Windows Tests
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Set up Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version-file: .python-version
        cache: pip
    - name: Install dependencies
      run: python -m pip install -r requirements.txt
    - name: Require Windows PowerShell and PowerShell 7
      shell: pwsh
      run: "foreach ($hostName in @('powershell', 'pwsh')) {\n  $executable = (Get-Command $hostName -ErrorAction Stop).Source\n\
        \  & $executable -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()'\n  if ($LASTEXITCODE -ne\
        \ 0) { exit $LASTEXITCODE }\n}\n"
    - name: Run Operation A tests on both Windows hosts
      shell: pwsh
      env:
        TEMP: ${{ runner.temp }}
        TMP: ${{ runner.temp }}
        TMPDIR: ${{ runner.temp }}
        HT_RUNTIME_DIR: ${{ runner.temp }}/operation-a-runtime
        PYTHONDONTWRITEBYTECODE: '1'
      run: 'python -m pytest tests/test_worktree_environment_preflight.py tests/test_worktree_lifecycle.py tests/test_worktree_snapshot.py
        -n 4 --dist load -v --tb=short --junitxml=artifacts/pytest/worktree-windows.xml

        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

        '
    - name: Require executed coverage without skips
      if: always()
      run: python -m tests.worktree_cleanup.verify_ci_report artifacts/pytest/worktree-windows.xml
    - name: Upload Operation A Windows JUnit
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: operation-a-windows-junit
        path: artifacts/pytest/worktree-windows.xml
        if-no-files-found: error
        retention-days: 14
    if: ${{ false }}
  pytest-core:
    name: Python Tests (core)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
    - name: Checkout code
