name: Packaged Windows build and bootloader smoke

# The frozen build plus the real-bootloader smoke, in one definition callable from
# more than one trigger. Extracted from ci.yml's `packaged-smoke-windows` job under
# Packet R1 (docs/release_pipeline/PLANNING.md), answering
# docs/TESTING_STRATEGY_PLANNING.md section 9.2 F5-8: a release pipeline written as a
# third copy of this build would triple the sync burden that job's comment already
# warned about.
#
# Packet R2-b folded deep-gate.yml's `frozen-windows` in as the third caller, so this
# is now the ONLY definition of the frozen Windows build in the repository. The three
# callers, and what each one exists to catch:
#
#   ci.yml         packaged-smoke-windows   every PR and push to main/develop
#   release.yml    packaged-windows         a release tag, or a dispatch
#   deep-gate.yml  frozen-windows           the weekly schedule, or a dispatch
#
# That first row puts this file on the PR path, and under R1-D4 it may become a
# REQUIRED context. Treat an edit here as an edit to the critical merge path even when
# the reason for it came from the weekly gate: one file now decides whether PRs merge,
# whether a release is publishable, and whether the weekly run means anything.
#
# **No caller passes anything.** This workflow declares no `inputs:` on purpose, so
# all three triggers build and smoke the identical artifact the identical way; a
# per-caller knob is how the two copies would come back in a subtler form.
# tests/test_release_workflow_contracts.py asserts that caller set in both directions
# -- a caller that stops calling reds, and a fourth caller that appears reds -- and
# pins the runner, the timeout and the smoke argv here, because after the lift this
# file is the only place any of them is stated.

on:
  workflow_call:

# `contents: read` is all a build needs. This workflow uploads nothing to a release,
# creates nothing, and pushes nothing; a called workflow can only narrow the token it
# is handed, so this holds from every caller. For deep-gate.yml's `frozen-windows`,
# which declared no `permissions:` of its own and so inherited the repository default,
# routing through here narrows the token it runs under.
permissions:
  contents: read

jobs:
  build-and-smoke:
    # This job id is load-bearing, and now for three checks rather than one. A `uses:`
    # job reports its status as "<caller job name> / <this job name>", so renaming this
    # half renames every caller's check at once:
    #
    #   Packaged Smoke (Windows bootloader, non-required) / Build and smoke
    #   Frozen Windows executable / Build and smoke
    #   Frozen executable (real bootloader, Windows) / Build and smoke
    #
    # The first is the string that would enter branch protection under R1-D4; renaming
    # either half orphans that context once it is promoted -- the rule in
    # docs/ai_workflow/QUALITY_GATE.md applies to BOTH halves.
    name: Build and smoke
    # windows-latest is not a preference. The artifact under test is a Windows .exe,
    # and a smoke on any other runner would be a passing test of a different build.
    runs-on: windows-latest
    # A hang detector, not a budget. 45 minutes is the value both lifted jobs already
    # carried. A `uses:` job cannot declare its own timeout, so this is the only place
    # any of the three callers gets one.
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Install runtime and pinned build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-build.txt
        python -c "import PyInstaller; print('PyInstaller ' + PyInstaller.__version__)"

    # Staging is what the spec calls too; running it first fails a broken
    # manifest in seconds instead of after a full build, and writes the
    # manifest.sha256 the smoke verifies the built tree against.
    - name: Stage tracked package assets
      run: python scripts/stage_package_assets.py

    - name: Build via the canonical spec
      run: pyinstaller --clean --noconfirm Hypertrophy-Toolbox.spec

    # --mode bootloader is the entire point. Do not weaken it to payload mode to
    # make a red run green: a payload pass says nothing about whether the
    # executable starts.
    #
    # --port is deliberately NOT 5000. Both launch paths used to hardcode 5000
    # while this script polled --port, so any non-default port silently failed;
    # serving on a non-default port is what proves that wiring works. The smoke
    # refuses to run when the port is already owned, so a passing run cannot be some
    # other process answering.
    #
    # No --skip-upgrade and no --skip-runtime, ever. The default run also plants a
    # legacy database beside the packaged assets and asserts it moves to the runtime
    # root, keeps its plan rows, and leaves the original byte-identical
    # (check_upgrade_migration in scripts/smoke_packaged_app.py). That is the only
    # automated proof of upgrade safety anywhere in CI; a flag that skips it would
    # save a minute and delete the guarantee.
    - name: Smoke the real bootloader
      run: python scripts/smoke_packaged_app.py --mode bootloader --port 5123

    - name: Upload distribution inventory on failure
      if: failure()
      run: |
        Get-ChildItem -Recurse dist/Hypertrophy-Toolbox/_internal/data |
          Select-Object FullName, Length | Format-Table -AutoSize
      shell: pwsh
