name: Release Gate

# THE `push: tags` TRIGGER BELOW HAS NEVER FIRED. Packet R1's only validation route
# is `workflow_dispatch` with `dry_run: true` (owner decision, option (c), 2026-08-14,
# docs/release_pipeline/PLANNING.md), and that dispatch can only run once this file is
# on the default branch -- so the first execution of ANY job here happens after the
# packet merges, and the first execution of the TAG path happens at the first genuine
# release. Confirm a run exists for the tag before believing any release is gated --
# see docs/RELEASE_CHECKLIST.md step 1.
#
# This workflow GATES; it does not publish. It creates no GitHub Release, uploads no
# release asset, signs nothing and pushes nothing. That is what keeps every
# permission below at `read`.
#
# It deliberately does NOT re-run the PR pipeline on the tag. `ci-provenance` asserts
# that the 12 expected check-runs already concluded success on this exact commit
# (R1-D2), which reuses the runs rather than the definitions. What runs here is only
# what ci.yml structurally cannot do for a tag: version identity, the frozen Windows
# build, and the two source-checkout database smokes.
#
# The trigger is the broad `v*` rather than a semver-narrowed filter on purpose. A
# narrow filter makes a malformed tag SILENT -- nothing triggers, nothing reports,
# nobody notices -- and that is the one failure mode this pipeline cannot detect from
# inside itself. A broad trigger with a strict guard makes the same mistake loud.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearse against a branch: skips only the tag-identity assertion, which has no tag to assert against. Never a bypass on a tag ref.'
        type: boolean
        default: true

permissions:
  contents: read

# R1-D6. Prefixed with github.workflow so a release run shares a group only with
# other release runs and can never contend with a CI or deep-gate run (the same
# reasoning ci.yml records at length). One tag is one ref, so a real release is
# always alone in its group; two rehearsal dispatches against the same branch do
# share one, and the later one supersedes a still-queued earlier one. That is
# accepted -- a rehearsal is repeatable, and cancel-in-progress stays false so a
# RUNNING release is never killed.
concurrency:
  group: ${{ github.workflow }}-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version-guard:
    name: Version and tag identity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'

    # `inputs.dry_run`, never `github.event.inputs.dry_run`: with `type: boolean` the
    # former is a real boolean and the latter is the string "true"/"false", and mixing
    # them is a silent inversion. On a tag push there are no inputs at all, so this
    # renders as the empty string -- which parse_dry_run() resolves to release mode.
    - name: Assert the tag matches the code
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        python scripts/release_gate.py version \
          --ref "${{ github.ref }}" \
          --dry-run "${{ inputs.dry_run }}" \
          --repo "${{ github.repository }}"

  ci-provenance:
    name: CI provenance on this commit
    runs-on: ubuntu-latest
    # 50 minutes because the 45-minute poll deadline has to fit inside it. Tagging
    # immediately after a merge means ci.yml's own E2E jobs may still be running, and
    # ci.yml's slowest job carries a 45-minute timeout of its own.
    timeout-minutes: 50
    permissions:
      contents: read
      checks: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'

    - name: Require every expected check-run to have succeeded on this SHA
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        python scripts/release_gate.py provenance \
          --sha "${{ github.sha }}" \
          --repo "${{ github.repository }}"

  packaged-windows:
    name: Frozen Windows executable
    uses: ./.github/workflows/_packaged-windows.yml

  first-install:
    name: First install (catalog seed) smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    # Keep in step with deep-gate.yml's `first-install`, which asserts the same
    # contract on the weekly gate. The two differ in the port, the step name, and
    # this copy's `set -euo pipefail`: HT_PORT is set here because a release job must
    # never assume 5000 is free.
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Boot a missing runtime DB and assert the catalog seeded
      env:
        HT_PORT: '5124'
      run: |
        set -euo pipefail
        export DB_FILE=artifacts/release/first-install.db
        mkdir -p "$(dirname "$DB_FILE")"
        rm -f "$DB_FILE" "$DB_FILE-wal" "$DB_FILE-shm" "$DB_FILE-journal"
        DB_FILE="$DB_FILE" FLASK_USE_RELOADER=0 python app.py &
        APP_PID=$!
        code=000
        for _ in $(seq 1 30); do
          # curl already prints 000 through -w on a refused connection; `|| echo`
          # would append a second one and make the diagnostic read "000\n000".
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5124/ || true)
          [ "$code" = "200" ] && break
          sleep 2
        done
        kill "$APP_PID" 2>/dev/null || true
        wait "$APP_PID" 2>/dev/null || true
        echo "first install: GET / -> $code"
        [ "$code" = "200" ]
        python - <<'PY'
        import os
        import sqlite3

        from utils.schema_registry import OWNED_TABLES_DROP_ORDER

        con = sqlite3.connect(os.environ["DB_FILE"])
        try:
            exercises = con.execute("SELECT COUNT(*) FROM exercises").fetchone()[0]
            assert exercises == 1897, f"catalog seed drifted: {exercises} exercises"
            for table in OWNED_TABLES_DROP_ORDER:
                count = con.execute(f'SELECT COUNT(*) FROM "{table}"').fetchone()[0]
                assert count == 0, (table, count)
        finally:
            con.close()
        PY

  old-db-migration:
    name: Old-DB migration compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    # Keep in step with deep-gate.yml's `old-db-migration`. The required column and
    # table sets below must stay a superset of that job's -- a contract test parses
    # both files and reds if this copy asserts less. `program_backups` and
    # `program_backup_items` are the load-bearing members: this is the only place any
    # gate proves a user's saved program backups survive a schema upgrade.
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Generate a historical-schema DB, boot it, assert the upgrade
      env:
        HT_PORT: '5125'
      run: |
        set -euo pipefail
        export DB_FILE=artifacts/release/old-schema.db
        python tests/fixtures/make_old_schema_db.py --output "$DB_FILE"
        DB_FILE="$DB_FILE" FLASK_USE_RELOADER=0 python app.py &
        APP_PID=$!
        root=000
        for _ in $(seq 1 30); do
          root=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5125/ || true)
          [ "$root" = "200" ] && break
          sleep 2
        done
        plan=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5125/workout_plan || true)
        kill "$APP_PID" 2>/dev/null || true
        wait "$APP_PID" 2>/dev/null || true
        echo "old-DB migration: GET / -> $root ; GET /workout_plan -> $plan"
        # Two standalone commands, NOT `[ ... ] && [ ... ]`. Under `set -e` bash
        # exempts every command in an && list except the last, so the && form does
        # not exit when the FIRST test fails -- it falls straight through to the
        # schema assertions below, which say nothing about HTTP. A build serving 500
        # on / would have reported success. deep-gate.yml carries the same defect and
        # is fixed in Packet R2, which may not touch that file before 2026-08-17.
        [ "$root" = "200" ]
        [ "$plan" = "200" ]
        python - <<'PY'
        import os
        import sqlite3

        con = sqlite3.connect(os.environ["DB_FILE"])
        try:
            columns = {
                row[1]
                for row in con.execute("PRAGMA table_info(user_selection)").fetchall()
            }
            required_columns = {
                "exercise_order",
                "superset_group",
                "execution_style",
                "time_cap_seconds",
            }
            missing_columns = sorted(required_columns - columns)
            if missing_columns:
                raise SystemExit(f"missing migrated columns: {missing_columns}")

            required_tables = {
                "progression_goals",
                "volume_plans",
                "muscle_volumes",
                "user_profile",
                "user_profile_lifts",
                "user_profile_preferences",
                "body_composition_snapshots",
                "learned_strength_calibrations",
                "user_calibration_settings",
                "program_backups",
                "program_backup_items",
            }
            tables = {
                row[0]
                for row in con.execute(
                    "SELECT name FROM sqlite_master WHERE type='table'"
                ).fetchall()
            }
            missing_tables = sorted(required_tables - tables)
            if missing_tables:
                raise SystemExit(f"missing migrated tables: {missing_tables}")

            row = con.execute(
                """
                SELECT routine, exercise, sets, min_rep_range, max_rep_range, rir, rpe, weight
                FROM user_selection
                WHERE routine = ? AND exercise = ?
                """,
                ("Legacy Routine", "Legacy Bench Press"),
            ).fetchone()
            expected = ("Legacy Routine", "Legacy Bench Press", 3, 6, 8, 2, 8.0, 100.0)
            if row != expected:
                raise SystemExit(f"legacy row mismatch: {row!r}")
        finally:
            con.close()
        PY

  release-gate:
    name: Release Gate
    needs: [version-guard, ci-provenance, packaged-windows, first-install, old-db-migration]
    # always() so this job runs -- and reports red -- even when a dependency failed or
    # was skipped. Without it a failed dependency leaves this job skipped, and a
    # skipped gate is indistinguishable from a gate that passed.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'

    # The whole `needs` object goes through env rather than being interpolated into
    # the shell, and the expected job-id set lives in release_gate.py where a test can
    # import it.
    - name: Require every release job to have reported and succeeded
      env:
        RELEASE_NEEDS: ${{ toJSON(needs) }}
      run: python scripts/release_gate.py fan-in
