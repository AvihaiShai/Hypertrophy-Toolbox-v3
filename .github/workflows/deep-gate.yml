name: Deep Gate (manual + weekly)

# Runs weekly as the owner-approved D3 safety-net stopgap (signed 2026-08-02,
# docs/TESTING_STRATEGY_PLANNING.md §8.1a; ordering per §8.7), or manually via
# workflow_dispatch. These slow / environment-sensitive checks deliberately do
# NOT gate every PR: full E2E incl. accessibility, the cold-start + old-DB
# migration smokes, and the informational dependency scan (moved here from the
# PR pipeline). Trigger manually from the Actions tab or with
# `gh workflow run deep-gate.yml --ref <branch>`.
#
# Visual regression (Phase 4.2) runs on the weekly schedule in compare mode, or
# manually when `run_visual` is enabled. It is NEVER a required PR check.
# The committed PNGs are split by platform (e2e/__screenshots__/{win32,linux}/);
# the Linux baselines are generated by this workflow's `generate` mode and
# committed by the owner after review (see docs/archive/ci_cd/phase4_2/PLANNING.md).
#
# This workflow owns the LINUX half only. Since #322, ci.yml's `visual-windows`
# job byte-compares the win32 corpus on every PR and every push to main, so the
# weekly run does not need to and must not duplicate it here.
on:
  schedule:
    # Mondays at 03:17 UTC; a non-zero minute avoids the top-of-hour queue spike.
    - cron: '17 3 * * 1'
  workflow_dispatch:
    inputs:
      run_visual:
        description: 'Run the Linux visual regression job'
        type: boolean
        default: false
      visual_mode:
        description: 'Visual mode: compare against committed Linux baselines, or generate new ones'
        type: choice
        options: [compare, generate]
        default: compare

# Every job below is bounded by a `timeout-minutes` — declared in place, except
# for `frozen-windows`, which is a `uses:` job and therefore cannot declare one;
# its bound lives in the workflow it calls, at the same 45 minutes. Without a
# timeout a job inherits the 360-minute default, which mattered little while
# every run was launched and watched by hand — but #323 made this workflow run
# unattended once a week, so a hung job now burns six hours of runner time with
# nobody watching.
#
# These are HANG DETECTORS, not budgets. Each is far above the observed maximum
# (measured over the 20 most recent completed runs, 2026-08-11) and matches the
# value ci.yml already uses for the closest equivalent job, so a slow-but-healthy
# run cannot red the weekly gate — the failure mode that trains an owner to
# ignore it. Re-derive from real runs before tightening any of them.
#
#   job               observed max   bound   declared in
#   full-e2e             20.2 min       45    here, per ci.yml's E2E Functional Shard
#   visual-linux          6.6 min       25    here, per ci.yml's Visual Regression Windows
#   frozen-windows        2.3 min       45    _packaged-windows.yml (a `uses:` job)
#   the four smokes      <1.2 min       15    here, the 15-minute floor
jobs:
  full-e2e:
    name: Full E2E incl. accessibility (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install npm dependencies
      run: npm ci

    - name: Build Bootstrap-customized CSS
      run: npm run build:css

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    # Run every spec EXCEPT the two visual ones (visual.spec.ts,
    # visual-baseline-thumbnails.spec.ts) — their committed baselines are
    # Windows-rendered and diff ~100% on ubuntu until Phase 4.2 lands a
    # Linux baseline set. Everything else runs, accessibility included; this is a
    # manual gate, so a human reads the report (known-red nav-dropdown may fail).
    # workout-plan-desktop-contract.spec.ts is excluded for the same reason as
    # the two snapshot specs: it needs the plan-bearing visual seed, and this
    # job runs on the user-state-wiped functional one. It runs in visual-linux.
    - name: Run full suite (minus visual)
      run: |
        SPECS=$(ls e2e/*.spec.ts | grep -vE 'visual\.spec\.ts|visual-baseline-thumbnails\.spec\.ts|workout-plan-desktop-contract\.spec\.ts' | tr '\n' ' ')
        echo "Running: $SPECS"
        npx playwright test --project=chromium $SPECS

    - name: Upload Playwright artifacts
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: deep-gate-full-e2e
        path: artifacts/playwright
        retention-days: 7

  first-install:
    name: First install (catalog seed) smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Fresh-clone / first-run path: the real app.py startup must copy the
    # immutable catalog seed into a missing configured runtime DB.
    - name: Boot missing runtime DB and assert seeded catalog
      run: |
        export DB_FILE=artifacts/deep-gate/first-install.db
        mkdir -p "$(dirname "$DB_FILE")"
        rm -f "$DB_FILE" "$DB_FILE-wal" "$DB_FILE-shm" "$DB_FILE-journal"
        DB_FILE="$DB_FILE" FLASK_USE_RELOADER=0 python app.py &
        APP_PID=$!
        code=000
        for _ in $(seq 1 30); do
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/ || echo 000)
          [ "$code" = "200" ] && break
          sleep 2
        done
        kill "$APP_PID" 2>/dev/null || true
        echo "first install: GET / -> $code"
        [ "$code" = "200" ]
        python - <<'PY'
        import os
        import sqlite3

        from utils.schema_registry import OWNED_TABLES_DROP_ORDER

        con = sqlite3.connect(os.environ["DB_FILE"])
        try:
            exercises = con.execute("SELECT COUNT(*) FROM exercises").fetchone()[0]
            assert exercises == 1897, exercises
            for table in OWNED_TABLES_DROP_ORDER:
                count = con.execute(
                    f'SELECT COUNT(*) FROM "{table}"'
                ).fetchone()[0]
                assert count == 0, (table, count)
        finally:
            con.close()
        PY

  empty-schema:
    name: Empty-schema initializer smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Bypass app.py's first-install bootstrap deliberately. This preserves the
    # independent contract that initializers can create a valid empty schema.
    - name: Initialize an empty DB, boot it, and assert GET / -> 200
      run: |
        export DB_FILE=artifacts/deep-gate/empty-schema.db
        mkdir -p "$(dirname "$DB_FILE")"
        rm -f "$DB_FILE" "$DB_FILE-wal" "$DB_FILE-shm" "$DB_FILE-journal"
        python - <<'PY'
        import sqlite3

        import utils.config
        from utils.schema_registry import run_all_initializers

        run_all_initializers(force_base=True)
        con = sqlite3.connect(utils.config.DB_FILE)
        try:
            exercises = con.execute("SELECT COUNT(*) FROM exercises").fetchone()[0]
            assert exercises == 0, exercises
        finally:
            con.close()
        PY
        DB_FILE="$DB_FILE" FLASK_USE_RELOADER=0 python app.py &
        APP_PID=$!
        code=000
        for _ in $(seq 1 30); do
          code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/ || echo 000)
          [ "$code" = "200" ] && break
          sleep 2
        done
        kill "$APP_PID" 2>/dev/null || true
        echo "empty schema: GET / -> $code"
        [ "$code" = "200" ]

  old-db-migration:
    name: Old-DB migration compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Generate a pre-migration DB (no exercise_order, no add_*_table tables) with a
    # seeded program row, then boot the real app.py. The startup ALTERs / add_*_table
    # helpers must upgrade it in place and serve both the welcome and plan pages.
    - name: Generate historical-schema DB, boot, assert upgrade
      run: |
        export DB_FILE=artifacts/deep-gate/old-schema.db
        python tests/fixtures/make_old_schema_db.py --output "$DB_FILE"
        DB_FILE="$DB_FILE" FLASK_USE_RELOADER=0 python app.py &
        APP_PID=$!
        root=000
        for _ in $(seq 1 30); do
          root=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/ || echo 000)
          [ "$root" = "200" ] && break
          sleep 2
        done
        plan=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/workout_plan || echo 000)
        kill "$APP_PID" 2>/dev/null || true
        echo "old-DB migration: GET / -> $root ; GET /workout_plan -> $plan"
        # Two standalone commands, NOT `[ ... ] && [ ... ]`. This block declares no
        # `shell:` key, so it runs under GitHub's default `bash -e {0}` -- and errexit
        # exempts every command in an && list except the last. In the combined form a
        # non-200 on / therefore did NOT stop the script: it fell straight through to
        # the python block below, which asserts columns, tables and the legacy row and
        # says nothing about HTTP, and the step then exited with THAT block's status.
        # A build serving 500 on the landing page reported success.
        #
        # Measured under `set -e`: combined with `root=500` and a succeeding command
        # after it -> falls through, exit 0; split -> exit 1. (In isolation, with the
        # list as the script's last command, the combined form does exit 1 -- which is
        # why this was invisible to a quick check and why `plan=500` always failed
        # correctly: the second test is the final command of the list.)
        #
        # `[ ... ] && break` in the readiness loops above is flow control, not an
        # assertion, and is deliberately left alone.
        [ "$root" = "200" ]
        [ "$plan" = "200" ]
        python - <<'PY'
        import os
        import sqlite3

        db_file = os.environ["DB_FILE"]
        con = sqlite3.connect(db_file)
        try:
            columns = {
                row[1]
                for row in con.execute("PRAGMA table_info(user_selection)").fetchall()
            }
            required_columns = {
                "exercise_order",
                "superset_group",
                "execution_style",
                "time_cap_seconds",
            }
            missing_columns = sorted(required_columns - columns)
            if missing_columns:
                raise SystemExit(f"missing migrated columns: {missing_columns}")

            required_tables = {
                "progression_goals",
                "volume_plans",
                "muscle_volumes",
                "user_profile",
                "user_profile_lifts",
                "user_profile_preferences",
                "body_composition_snapshots",
                "learned_strength_calibrations",
                "user_calibration_settings",
                "program_backups",
                "program_backup_items",
            }
            tables = {
                row[0]
                for row in con.execute(
                    "SELECT name FROM sqlite_master WHERE type='table'"
                ).fetchall()
            }
            missing_tables = sorted(required_tables - tables)
            if missing_tables:
                raise SystemExit(f"missing migrated tables: {missing_tables}")

            row = con.execute(
                """
                SELECT routine, exercise, sets, min_rep_range, max_rep_range, rir, rpe, weight
                FROM user_selection
                WHERE routine = ? AND exercise = ?
                """,
                ("Legacy Routine", "Legacy Bench Press"),
            ).fetchone()
            expected = ("Legacy Routine", "Legacy Bench Press", 3, 6, 8, 2, 8.0, 100.0)
            if row != expected:
                raise SystemExit(f"legacy row mismatch: {row!r}")
        finally:
            con.close()
        PY

  frozen-windows:
    name: Frozen executable (real bootloader, Windows)
    # The half the development machine cannot run. Smart App Control there
    # refuses to launch a freshly built, unsigned bootloader (WinError 4551),
    # so the local smoke falls back to --mode payload, which exercises the
    # packaged files but NOT the bootloader. GitHub's Windows runners do not
    # enforce Smart App Control, so this job launches the executable an end
    # user actually double-clicks. Disabling Smart App Control locally is not
    # an option that was ever on the table.
    #
    # Packet R2-b moved this job's body into the reusable workflow ci.yml and
    # release.yml already shared, so the repository now holds ONE definition of
    # the frozen Windows build instead of two. R1 deliberately left the copy
    # here: a scheduled workflow runs the default branch's HEAD copy of its own
    # file, and editing it before the first authoritative scheduled run would
    # have meant that run validated something other than what shipped.
    #
    # `runs-on: windows-latest` and `timeout-minutes: 45` now live in the called
    # workflow -- a `uses:` job may declare neither. Both carry the same values
    # this job declared, and tests/test_release_workflow_contracts.py pins them
    # there so the lift cannot quietly change either.
    #
    # Two deliberate differences from the copy this replaces, neither of which
    # weakens the job:
    #   * the smoke serves on --port 5123 rather than the script's default 5000.
    #     smoke_packaged_app.py refuses to start when the port is already owned,
    #     so a pass still cannot be some other process answering.
    #   * the called workflow declares `permissions: contents: read`, where this
    #     job previously inherited the repository default. A build that checks
    #     out, compiles and smokes needs nothing more.
    #
    # The check this job reports is now
    # `Frozen executable (real bootloader, Windows) / Build and smoke`, because a
    # `uses:` job reports as `<caller job name> / <called job name>`. That rename
    # is safe here and only here: deep-gate.yml runs on the weekly schedule and
    # on workflow_dispatch, and none of its jobs is a branch-protection context.
    # See docs/ai_workflow/QUALITY_GATE.md before converting any other job.
    uses: ./.github/workflows/_packaged-windows.yml

  visual-linux:
    name: Visual regression (Linux baselines)
    # A manual run remains opt-in; scheduled runs always compare the committed
    # baselines so the weekly workflow cannot report a false green with this job
    # skipped. This is not a required PR check.
    if: ${{ github.event_name == 'schedule' || inputs.run_visual }}
    # PINNED to ubuntu-24.04 (NOT ubuntu-latest): the generate and compare runs
    # must share one runner image so the renderer (Chromium build + bundled fonts
    # + freetype) matches by construction. A GitHub image promotion must not
    # silently move fonts and red the gate. This MUST match the image used to
    # generate the committed e2e/__screenshots__/linux/ baselines.
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
        cache: 'pip'

    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: '24'
        cache: 'npm'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Install npm dependencies
      run: npm ci

    - name: Build Bootstrap-customized CSS
      run: npm run build:css

    - name: Install Playwright Chromium
      run: npx playwright install --with-deps chromium

    # Fail fast if the committed visual seed is missing — prepare_visual_db.py
    # would otherwise fall back to data/database.db (DEFAULT_SOURCE) and could
    # render real data into a baseline artifact.
    - name: Assert committed visual seed present
      run: test -f e2e/fixtures/database.visual.seed.db

    # Run ONLY the two visual specs. PW_VISUAL_SEED=1 makes playwright.config.ts
    # seed the throwaway DB with the plan-bearing visual seed (prepare_visual_db.py)
    # in the webServer command before Flask opens it — no per-spec runtime DB
    # rewrite. generate mode writes baselines under e2e/__screenshots__/linux/
    # (via the {platform} snapshotPathTemplate); compare diffs against them.
    - name: Run visual specs
      id: visual
      env:
        PW_VISUAL_SEED: '1'
      run: |
        # A schedule event carries no `inputs` at all, so the fallback already
        # resolves to compare. Pin it again on the event name so the weekly run
        # stays compare-only even if the input default is ever changed, and
        # publish the resolved value — every later step reads it rather than
        # re-deriving "is this a generate run" from the raw input.
        MODE="${{ inputs.visual_mode || 'compare' }}"
        [ "${{ github.event_name }}" = "schedule" ] && MODE=compare
        UPDATE=""; [ "$MODE" = "generate" ] && UPDATE="--update-snapshots"
        echo "mode=$MODE" >> "$GITHUB_OUTPUT"
        echo "Visual mode: $MODE"
        npx playwright test --project=chromium \
          e2e/visual.spec.ts e2e/visual-baseline-thumbnails.spec.ts \
          e2e/workout-plan-desktop-contract.spec.ts $UPDATE

    # #322 made "CI never writes baselines" mechanical for the Windows suite in
    # ci.yml; this job had only ever asserted it in prose, which was tenable
    # while every run was launched and watched by hand. A scheduled run is
    # unattended by definition, and Playwright CREATES a missing baseline
    # instead of failing — so a green compare is not by itself proof that
    # nothing was written. always() so a compare that fails AND writes still
    # reports the write.
    - name: Assert compare mode wrote no baseline
      if: ${{ always() && steps.visual.outputs.mode != 'generate' }}
      run: |
        CHANGED="$(git status --porcelain -- e2e/__screenshots__)"
        if [ -n "$CHANGED" ]; then
          echo "$CHANGED"
          echo "a compare run wrote to e2e/__screenshots__; baselines change only through a reviewed generate run"
          exit 1
        fi

    # generate → upload the freshly rendered Linux baselines for owner review+commit.
    # CI never pushes to main (branch-protected) — every pixel change is committed
    # by a human after downloading and inspecting this artifact.
    - name: Upload generated Linux baselines
      if: ${{ steps.visual.outputs.mode == 'generate' }}
      uses: actions/upload-artifact@v7
      with:
        name: visual-baselines-linux
        path: e2e/__screenshots__/linux/**
        retention-days: 14

    # compare (or generate) failure → upload report + actual/expected/diff PNGs.
    - name: Upload Playwright report + diffs
      if: failure()
      uses: actions/upload-artifact@v7
      with:
        name: visual-linux-report
        path: artifacts/playwright
        retention-days: 7

  dependency-health:
    name: Dependency Health Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Moved out of the required PR pipeline (Phase 4.5) — outdated/safety scans are
    # informational and don't belong on the critical merge path.
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'

    - name: Check for outdated packages
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip list --outdated
      continue-on-error: true

    - name: Check package vulnerabilities
      run: |
        pip install safety
        safety check --json || true
      continue-on-error: true
