name: B2 Rehearsal (throwaway, never merged)

# Throwaway rehearsal for CI packet B2. The job below is a byte-for-byte copy of
# ci.yml's workflow-lint job; only the trigger differs. Never merged.
on:
  push:
    branches: ['rehearsal/b2-**']

permissions:
  contents: read

jobs:
  workflow-lint:
    name: Workflow Lint (actionlint + zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      ACTIONLINT_VERSION: '1.7.12'
      ACTIONLINT_SHA256: '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8'
      ZIZMOR_VERSION: '1.30.1'
      ZIZMOR_SHA256: 'e65324f4430c2717591937edcec90ccbefaf14c174f8ec9415e03ca875b46e1a'
      SHELLCHECK_VERSION: 'v0.11.0'
      SHELLCHECK_SHA256: 'b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6'

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install pinned workflow linters
      run: |
        set -euo pipefail
        cd "$RUNNER_TEMP"
        curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
          --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 -o actionlint.tar.gz \
          "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
        curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
          --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 -o zizmor.tar.gz \
          "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
        curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
          --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 -o shellcheck.tar.gz \
          "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.gz"
        printf '%s  %s\n' \
          "$ACTIONLINT_SHA256" actionlint.tar.gz \
          "$ZIZMOR_SHA256" zizmor.tar.gz \
          "$SHELLCHECK_SHA256" shellcheck.tar.gz \
          | sha256sum --check --strict
        mkdir -p workflow-lint-bin
        tar -xzf actionlint.tar.gz -C workflow-lint-bin actionlint
        tar -xzf zizmor.tar.gz -C workflow-lint-bin zizmor
        tar -xzf shellcheck.tar.gz -C workflow-lint-bin --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
        workflow-lint-bin/actionlint -version
        workflow-lint-bin/zizmor --version
        workflow-lint-bin/shellcheck --version

    - name: actionlint
      run: |
        "$RUNNER_TEMP/workflow-lint-bin/actionlint" -color -shellcheck="$RUNNER_TEMP/workflow-lint-bin/shellcheck" -pyflakes=

    - name: zizmor (min severity medium)
      if: ${{ !cancelled() }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        "$RUNNER_TEMP/workflow-lint-bin/zizmor" --min-severity medium --format plain .github/workflows

  # This job also owns the compiled-SCSS drift gate (docs/LEFTOVERS_BY_PRIORITY.md,
  # "Nothing ties the committed bootstrap.custom.min.css to its SCSS source").
  #
  # The bundle and its map are TRACKED, but the pytest job deliberately does not
  # run npm, so every CSS contract in tests/test_css_*.py asserts against the
  # COMMITTED artifact. Every E2E job, meanwhile, rebuilds it and exercises
  # whatever the SCSS actually compiles to. Editing scss/ and forgetting
  # `npm run build:css` therefore left the contracts green against a stale blob
  # while the browser ran different CSS -- two sources of truth, no gate between
  # them. This job already ran the real build; all it lacked was a verdict.
  #
  # NOTE: the `name:` below is a branch-protection required status check — keep
  # it byte-for-byte, same rule as `typecheck` and the two `(non-required)` E2E
  # jobs (docs/ai_workflow/QUALITY_GATE.md, "CI job naming"). Renaming it orphans
  # the context, and tests/test_compiled_css_drift_gate_contracts.py pins it.
