# THROWAWAY B3 rehearsal (docs/ci_cd_expansion/PLANNING.md section 17). Never merged.
# Job = ci.yml `dependency-review` minus its PR-only `if:`, plus base-ref/head-ref.
name: B3 rehearsal (throwaway)

on:
  push:
    branches: ['rehearsal/b3-*']

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
    - name: Review dependency changes
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: high
        fail-on-scopes: runtime, development, unknown
        warn-only: false
        vulnerability-check: true
        license-check: false
        show-openssf-scorecard: false
        comment-summary-in-pr: never
        retry-on-snapshot-warnings: false
        base-ref: 71c4cc6d2eea1147fcd3b1defe89fabaff0fb3ac
        head-ref: ${{ github.sha }}
