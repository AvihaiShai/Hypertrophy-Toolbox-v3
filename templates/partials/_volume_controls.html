{% macro method_selector(update_function_name) %}
<div class="method-selector">
    <label for="contribution-mode">Muscle Contribution Mode</label>
    <select id="contribution-mode" class="ui-select" aria-describedby="contribution-help" onchange="{{ update_function_name }}()">
        <option value="total" selected>Total (Primary + Secondary + Tertiary)</option>
        <option value="direct">Direct Only (Primary Muscle Only)</option>
    </select>
    <p id="contribution-help" class="form-text">Total credits primary, secondary and tertiary muscles. Direct Only counts the primary muscle.</p>
</div>
{% endmacro %}
